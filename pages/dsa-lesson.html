{id:1,title:"Two Pointers",module:1,difficulty:"facile",duration:"20 min",
content:`
<h2 id="definition">Technique des Deux Pointeurs</h2>
<p>Two Pointers est une technique ou deux iterateurs parcourent une structure de donnees (tableau, linked list) depuis des positions differentes, typiquement debut/fin ou rapide/lent. Elle reduit la complexite de O(n²) a O(n) pour de nombreux problemes.</p>
<div class="callout"><strong>Quand l'utiliser :</strong> Tableaux tries, paires d'elements, validation palindrome, sous-tableaux.</div>

<h2 id="opposing">Pointeurs Opposes (Debut/Fin)</h2>
<pre><code># Valider une palindrome
def is_palindrome(s):
    left, right = 0, len(s) - 1
    while left < right:
        if s[left] != s[right]:
            return False
        left += 1
        right -= 1
    return True

# Trouver une paire dont la somme = target (tableau trie)
def two_sum_sorted(nums, target):
    left, right = 0, len(nums) - 1
    while left < right:
        current_sum = nums[left] + nums[right]
        if current_sum == target:
            return [left, right]
        elif current_sum < target:
            left += 1
        else:
            right -= 1
    return []</code></pre>

<h2 id="sliding">Two Pointers + Sliding Window</h2>
<pre><code># Suppression des doublons d'un tableau trie
def remove_duplicates(nums):
    if not nums:
        return 0
    slow = 0
    for fast in range(1, len(nums)):
        if nums[fast] != nums[slow]:
            slow += 1
            nums[slow] = nums[fast]
    return slow + 1</code></pre>

<h2 id="formula">Complexite</h2>
<div class="formula">Temps : O(n) | Espace : O(1)</div>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Quand utiliser Two Pointers vs Hash Map ?</h4><p><strong>Two Pointers</strong> : tableau trie, pas besoin de stocker des elements. <strong>Hash Map</strong> : tableau non trie, besoin de lookup rapide. Two Pointers est plus econome en espace O(1) vs O(n).</p></div>
<div class="qa"><h4>Q2 : Comment detecter un cycle dans une linked list ?</h4><p>Utilisez le cycle detection de Floyd : un pointeur avance de 1, l'autre de 2. S'ils se rencontrent, il y a un cycle. Temps O(n), espace O(1).</p></div>
`},

{id:2,title:"Sliding Window",module:1,difficulty:"moyen",duration:"20 min",
content:`
<h2 id="definition">Fenetre Glissante</h2>
<p>Sliding Window maintain une fenetre (sous-tableau) qui avance sur les donnees. Au lieu de recalculer de zero a chaque position, on ajuste la fenetre en ajoutant un element et en supprimant l'autre.</p>

<h2 id="fixed">Fenetre de Taille Fixe</h2>
<pre><code># Sous-tableau de taille k avec la plus grande somme
def max_sum_subarray(nums, k):
    window_sum = sum(nums[:k])
    max_sum = window_sum
    
    for i in range(k, len(nums)):
        window_sum += nums[i] - nums[i - k]
        max_sum = max(max_sum, window_sum)
    
    return max_sum</code></pre>

<h2 id="variable">Fenetre de Taille Variable</h2>
<pre><code># Plus longue sous-chaine sans repetition
def length_of_longest_substring(s):
    char_set = set()
    left = 0
    max_length = 0
    
    for right in range(len(s)):
        while s[right] in char_set:
            char_set.remove(s[left])
            left += 1
        char_set.add(s[right])
        max_length = max(max_length, right - left + 1)
    
    return max_length</code></pre>

<h2 id="pattern">Pattern General</h2>
<pre><code># Template sliding window
def sliding_window(s):
    window = {}  # compteurs de la fenetre
    left = 0
    result = 0
    
    for right in range(len(s)):
        # 1. Ajouter l'element droit
        char = s[right]
        window[char] = window.get(char, 0) + 1
        
        # 2. Reduire tant que la fenetre est invalide
        while window_invalide:
            left_char = s[left]
            window[left_char] -= 1
            left += 1
        
        # 3. Mettre a jour le resultat
        result = max(result, right - left + 1)
    
    return result</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Comment reconnaitre un probleme sliding window ?</h4><p>Indices : 1) Sous-chaine/sous-tableau continu. 2) Taille fixe ou contrainte de longueur. 3) Min/max de quelque chose. 4) Pattern de caracteres consecutifs.</p></div>
<div class="qa"><h4>Q2 : Sliding window vs Two Pointers ?</h4><p><strong>Sliding Window</strong> : sous-structure contigue, fenetre qui grandit/retrécit. <strong>Two Pointers</strong> : deux positions independantes, souvent debut/fin. Sliding window est un cas special de two pointers.</p></div>
`},

{id:3,title:"Fast & Slow Pointers",module:1,difficulty:"moyen",duration:"15 min",
content:`
<h2 id="definition">Pointeurs Rapide et Lent</h2>
<p>Un pointeur avance de 1 pas, l'autre de 2 pas. Utile pour : detection de cycles, trouver le milieu, et problemes de linked lists.</p>

<h2 id="cycle">Detection de Cycle</h2>
<pre><code># Floyd's Cycle Detection
def has_cycle(head):
    slow = fast = head
    while fast and fast.next:
        slow = slow.next
        fast = fast.next.next
        if slow == fast:
            return True
    return False

# Trouver le debut du cycle
def detect_cycle_start(head):
    slow = fast = head
    while fast and fast.next:
        slow = slow.next
        fast = fast.next.next
        if slow == fast:
            # Reset slow, avancer les deux de 1
            slow = head
            while slow != fast:
                slow = slow.next
                fast = fast.next
            return slow
    return None</code></pre>

<h2 id="milieu">Milieu d'une Linked List</h2>
<pre><code>def find_middle(head):
    slow = fast = head
    while fast and fast.next:
        slow = slow.next
        fast = fast.next.next
    return slow  # slow est au milieu</code></pre>

<h2 id="happy-number">Happy Number</h2>
<pre><code>def is_happy(n):
    def get_next(num):
        total = 0
        while num > 0:
            num, digit = divmod(num, 10)
            total += digit ** 2
        return total
    
    slow = fast = n
    while True:
        slow = get_next(slow)
        fast = get_next(get_next(fast))
        if fast == 1:
            return True
        if slow == fast:
            return False</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Pourquoi le pointeur rapide avance-t-il de 2 pas ?</h4><p>Avec un pas de 2, le pointeur rapide "rattrape" le lent dans un cycle. La distance entre eux diminue de 1 a chaque pas (dans un cycle, le pointeur rapide gagne 1 pas de retard par tour). Il finit forcement par coincider.</p></div>
`},

{id:4,title:"Merge Intervals",module:1,difficulty:"moyen",duration:"15 min",
content:`
<h2 id="definition">Fusionner les Intervalles</h2>
<p>Probleme classique : fusionner tous les intervalles qui se chevauchent dans un ensemble d'intervalles.</p>

<h2 id="fusion">Fusion d'intervalles</h2>
<pre><code>def merge_intervals(intervals):
    if not intervals:
        return []
    
    # Trier par debut
    intervals.sort(key=lambda x: x[0])
    merged = [intervals[0]]
    
    for current in intervals[1:]:
        last = merged[-1]
        if current[0] <= last[1]:  # chevauchement
            merged[-1] = [last[0], max(last[1], current[1])]
        else:
            merged.append(current)
    
    return merged</code></pre>

<h2 id="insertion">Insertion d'intervalle</h2>
<pre><code>def insert_interval(intervals, new_interval):
    result = []
    i = 0
    
    # Ajouter les intervalles avant le chevauchement
    while i < len(intervals) and intervals[i][1] < new_interval[0]:
        result.append(intervals[i])
        i += 1
    
    # Fusionner les intervalles chevauchants
    while i < len(intervals) and intervals[i][0] <= new_interval[1]:
        new_interval[0] = min(new_interval[0], intervals[i][0])
        new_interval[1] = max(new_interval[1], intervals[i][1])
        i += 1
    result.append(new_interval)
    
    # Ajouter le reste
    while i < len(intervals):
        result.append(intervals[i])
        i += 1
    
    return result</code></pre>

<h2 id="complexite">Complexite</h2>
<div class="formula">Temps : O(n log n) pour le tri | Espace : O(n)</div>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Probleme classique avec Merge Intervals ?</h4><p>1) Merge Overlapping Intervals. 2) Insert Interval. 3) Minimum Number of Arrows to Burst Balloons. 4) Non-overlapping Intervals. 5) Meeting Rooms II.</p></div>
`},

{id:5,title:"Cyclic Sort",module:1,difficulty:"moyen",duration:"15 min",
content:`
<h2 id="definition">Tri Cyclique</h2>
<p>Cyclic Sort est optimal pour les tableaux contenant des nombres dans la plage [1, n]. On place chaque element a sa position correcte en O(n) temps et O(1) espace.</p>

<h2 id="tri">Tri cyclique</h2>
<pre><code>def cyclic_sort(nums):
    i = 0
    while i < len(nums):
        correct = nums[i] - 1
        if nums[i] != nums[correct]:
            nums[i], nums[correct] = nums[correct], nums[i]
        else:
            i += 1
    return nums</code></pre>

<h2 id="manquants">Nombres manquants</h2>
<pre><code>def find_missing_numbers(nums):
    # Placer chaque element a sa position
    i = 0
    while i < len(nums):
        correct = nums[i] - 1
        if nums[i] != nums[correct]:
            nums[i], nums[correct] = nums[correct], nums[i]
        else:
            i += 1
    
    # Les positions qui n'ont pas la bonne valeur = manquants
    missing = []
    for i in range(len(nums)):
        if nums[i] != i + 1:
            missing.append(i + 1)
    
    return missing</code></pre>

<h2 id="duplicates">Nombres duplicates</h2>
<pre><code>def find_duplicates(nums):
    i = 0
    while i < len(nums):
        correct = nums[i] - 1
        if nums[i] != nums[correct]:
            nums[i], nums[correct] = nums[correct], nums[i]
        else:
            if i != correct:  # duplicate
                return nums[i]
            i += 1
    return -1</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Quand utiliser Cyclic Sort ?</h4><p>Quand le tableau contient des nombres dans la plage [1, n] ou [0, n]. Problemes : trouver les manquants, les duplicates, ou trier sans espace supplementaire.</p></div>
`},

{id:6,title:"In-place Reversal Linked List",module:1,difficulty:"moyen",duration:"15 min",
content:`
<h2 id="definition">Inverser une Linked List In-place</h2>
<p>Inverser les pointeurs d'une linked list sans allocation memoire supplementaire.</p>

<h2 id="simple">Inversion simple</h2>
<pre><code>def reverse_list(head):
    prev = None
    current = head
    while current:
        next_temp = current.next
        current.next = prev
        prev = current
        current = next_temp
    return prev</code></pre>

<h2 id="k-group">Inversion par K-groupes</h2>
<pre><code>def reverse_k_group(head, k):
    # Verifier s'il reste k noeuds
    node = head
    for _ in range(k):
        if not node:
            return head
        node = node.next
    
    # Inverser k noeuds
    prev = None
    current = head
    for _ in range(k):
        next_temp = current.next
        current.next = prev
        prev = current
        current = next_temp
    
    # head est maintenant la fin du groupe,递归 le reste
    head.next = reverse_k_group(current, k)
    return prev</code></pre>

<h2 id="complexite">Complexite</h2>
<div class="formula">Temps : O(n) | Espace : O(1)</div>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Comment inverser une partie d'une linked list ?</h4><p>1) Trouver le debut et la fin. 2) Inverser les pointeurs dans la plage. 3) Reconnecter les extremites. 4) Attention aux edge cases (debut, fin, taille k).</p></div>
`},

{id:7,title:"Tree BFS",module:1,difficulty:"moyen",duration:"20 min",
content:`
<h2 id="level-order">Level Order Traversal (BFS)</h2>
<p>Parcours en largeur d'un arbre : on visite les noeuds niveau par niveau en utilisant une file (queue).</p>
<pre><code>from collections import deque

def level_order(root):
    if not root:
        return []
    
    result = []
    queue = deque([root])
    
    while queue:
        level_size = len(queue)
        level = []
        
        for _ in range(level_size):
            node = queue.popleft()
            level.append(node.val)
            
            if node.left:
                queue.append(node.left)
            if node.right:
                queue.append(node.right)
        
        result.append(level)
    
    return result</code></pre>

<h2 id="zigzag">Zigzag Level Order</h2>
<pre><code>def zigzag_level_order(root):
    if not root:
        return []
    
    result = []
    queue = deque([root])
    left_to_right = True
    
    while queue:
        level_size = len(queue)
        level = deque()
        
        for _ in range(level_size):
            node = queue.popleft()
            
            if left_to_right:
                level.append(node.val)
            else:
                level.appendleft(node.val)
            
            if node.left:
                queue.append(node.left)
            if node.right:
                queue.append(node.right)
        
        result.append(list(level))
        left_to_right = not left_to_right
    
    return result</code></pre>

<h2 id="min-depth">Profondeur Minimum</h2>
<pre><code>def min_depth(root):
    if not root:
        return 0
    
    queue = deque([(root, 1)])
    while queue:
        node, depth = queue.popleft()
        
        if not node.left and not node.right:
            return depth
        
        if node.left:
            queue.append((node.left, depth + 1))
        if node.right:
            queue.append((node.right, depth + 1))</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : BFS vs DFS pour les arbres ?</h4><p><strong>BFS</strong> : trouver le plus court chemin, parcours niveau par niveau, arbre equilibre. <strong>DFS</strong> : verifier l'existence d'un chemin, chemins racine-feuille, espace moins profond. BFS utilise une file, DFS utilise une pile (ou recursion).</p></div>
`},

{id:8,title:"Tree DFS",module:1,difficulty:"moyen",duration:"20 min",
content:`
<h2 id="preorder">Preorder (Racine-Gauche-Droite)</h2>
<pre><code>def preorder(root):
    if not root:
        return []
    return [root.val] + preorder(root.left) + preorder(root.right)

# Iteratif
def preorder_iterative(root):
    if not root:
        return []
    
    result = []
    stack = [root]
    
    while stack:
        node = stack.pop()
        result.append(node.val)
        
        if node.right:
            stack.append(node.right)
        if node.left:
            stack.append(node.left)
    
    return result</code></pre>

<h2 id="inorder">Inorder (Gauche-Racine-Droite)</h2>
<pre><code>def inorder(root):
    if not root:
        return []
    return inorder(root.left) + [root.val] + inorder(root.right)

# Iteratif
def inorder_iterative(root):
    result = []
    stack = []
    current = root
    
    while current or stack:
        while current:
            stack.append(current)
            current = current.left
        
        current = stack.pop()
        result.append(current.val)
        current = current.right
    
    return result</code></pre>

<h2 id="postorder">Postorder (Gauche-Droite-Racine)</h2>
<pre><code>def postorder(root):
    if not root:
        return []
    return postorder(root.left) + postorder(root.right) + [root.val]</code></pre>

<h2 id="paths">Chemins Racine-Feuille</h2>
<pre><code>def binary_tree_paths(root):
    result = []
    
    def dfs(node, path):
        if not node:
            return
        path.append(str(node.val))
        if not node.left and not node.right:
            result.append("->".join(path))
        dfs(node.left, path)
        dfs(node.right, path)
        path.pop()
    
    dfs(root, [])
    return result</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Quand utiliser chaque type de DFS ?</h4><p><strong>Preorder</strong> : copier/cloner un arbre, prefix expression. <strong>Inorder</strong> : BST triee, expression infix. <strong>Postorder</strong> : supprimer un arbre, expression postfix, calcul de taille.</p></div>
`},

{id:9,title:"Two Heaps",module:1,difficulty:"moyen",duration:"15 min",
content:`
<h2 id="definition">Deux Tas pour la Mediane</h2>
<p>Utiliser un tas max pour la moitie inferieure et un tas min pour la moitie superieure. La mediane est toujours au sommet des deux tas.</p>

<h2 id="median">Trouver la Mediane</h2>
<pre><code>import heapq

class MedianFinder:
    def __init__(self):
        self.max_heap = []  # moitie inferieure (negatif pour max heap)
        self.min_heap = []  # moitie superieure
    
    def add_number(self, num):
        if not self.max_heap or num <= -self.max_heap[0]:
            heapq.heappush(self.max_heap, -num)
        else:
            heapq.heappush(self.min_heap, num)
        
        # Equilibrer
        if len(self.max_heap) > len(self.min_heap) + 1:
            val = -heapq.heappop(self.max_heap)
            heapq.heappush(self.min_heap, val)
        elif len(self.min_heap) > len(self.max_heap) + 1:
            val = heapq.heappop(self.min_heap)
            heapq.heappush(self.max_heap, -val)
    
    def find_median(self):
        if len(self.max_heap) == len(self.min_heap):
            return (-self.max_heap[0] + self.min_heap[0]) / 2
        elif len(self.max_heap) > len(self.min_heap):
            return -self.max_heap[0]
        else:
            return self.min_heap[0]</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Pourquoi deux tas plutot qu'un seul ?</h4><p>Un seul tas ne permet pas d'acceder efficacement a la mediane. Avec deux tas, on garde la moitie inferieure (max heap) et la moitie superieure (min heap) equilibrees. La mediane est toujours accessible en O(1).</p></div>
`},

{id:10,title:"Subsets",module:1,difficulty:"moyen",duration:"20 min",
content:`
<h2 id="definition">Generer tous les Sous-ensembles</h2>
<p>Le pattern Subsets genere toutes les combinaisons possibles d'un ensemble. Complexite : O(2^n).</p>

<h2 id="iteratif">Approche Iterative</h2>
<pre><code>def subsets(nums):
    result = [[]]
    for num in nums:
        result += [subset + [num] for subset in result]
    return result

# [1,2] -> [[], [1], [2], [1,2]]</code></pre>

<h2 id="backtracking">Backtracking</h2>
<pre><code>def subsets_backtrack(nums):
    result = []
    
    def backtrack(start, current):
        result.append(current[:])
        for i in range(start, len(nums)):
            current.append(nums[i])
            backtrack(i + 1, current)
            current.pop()
    
    backtrack(0, [])
    return result</code></pre>

<h2 id="permutations">Permutations</h2>
<pre><code>def permutations(nums):
    result = []
    
    def backtrack(current):
        if len(current) == len(nums):
            result.append(current[:])
            return
        for num in nums:
            if num not in current:
                current.append(num)
                backtrack(current)
                current.pop()
    
    backtrack([])
    return result</code></pre>

<h2 id="combinations">Combinations (k elements)</h2>
<pre><code>def combinations(n, k):
    result = []
    
    def backtrack(start, current):
        if len(current) == k:
            result.append(current[:])
            return
        for i in range(start, n + 1):
            current.append(i)
            backtrack(i + 1, current)
            current.pop()
    
    backtrack(1, [])
    return result</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Subsets vs Subsequences ?</h4><p><strong>Subsets</strong> : tous les sous-ensembles possibles (2^n). <strong>Subsequences</strong> : elements dans l'ordre (pas necessairement consecutifs). Subsets contient toutes les subsequences.</p></div>
`},

{id:11,title:"Modified Binary Search",module:2,difficulty:"moyen",duration:"20 min",
content:`
<h2 id="definition">Recherche Binaire Modifiee</h2>
<p>La recherche binary classique cherche dans un tableau trie. Les variantes gerent des scenarios speciaux : tableaux rotés, premier/dernier occurrence, etc.</p>

<h2 id="rotated">Recherche dans un Tableau Roté</h2>
<pre><code>def search_rotated(nums, target):
    left, right = 0, len(nums) - 1
    
    while left <= right:
        mid = (left + right) // 2
        
        if nums[mid] == target:
            return mid
        
        # La moitie gauche est triee
        if nums[left] <= nums[mid]:
            if nums[left] <= target < nums[mid]:
                right = mid - 1
            else:
                left = mid + 1
        # La moitie droite est triee
        else:
            if nums[mid] < target <= nums[right]:
                left = mid + 1
            else:
                right = mid - 1
    
    return -1</code></pre>

<h2 id="first-last">Premiere/Derniere Occurrence</h2>
<pre><code>def find_first(nums, target):
    left, right = 0, len(nums) - 1
    result = -1
    while left <= right:
        mid = (left + right) // 2
        if nums[mid] == target:
            result = mid
            right = mid - 1  # chercher plus a gauche
        elif nums[mid] < target:
            left = mid + 1
        else:
            right = mid - 1
    return result

def find_last(nums, target):
    left, right = 0, len(nums) - 1
    result = -1
    while left <= right:
        mid = (left + right) // 2
        if nums[mid] == target:
            result = mid
            left = mid + 1  # chercher plus a droite
        elif nums[mid] < target:
            left = mid + 1
        else:
            right = mid - 1
    return result</code></pre>

<h2 id="complexite">Complexite</h2>
<div class="formula">Temps : O(log n) | Espace : O(1)</div>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Comment adapter binary search pour un minimum ?</h4><p>Chercher le premier element ou <code>nums[mid] < nums[mid+1]</code>. Si <code>nums[mid] > nums[right]</code>, le minimum est a droite. Sinon a gauche. Retourner <code>nums[left]</code> a la fin.</p></div>
`},

{id:12,title:"Top K Elements",module:2,difficulty:"moyen",duration:"20 min",
content:`
<h2 id="definition">K Elements les Plus Importants</h2>
<p>Utiliser un tas (heap) pour maintenir les K elements les plus importants en O(n log k).</p>

<h2 id="k-frequent">K Elements les Plus Frequents</h2>
<pre><code>from collections import Counter
import heapq

def top_k_frequent(nums, k):
    count = Counter(nums)
    
    # Min heap de taille k
    return heapq.nlargest(k, count.keys(), key=count.get)</code></pre>

<h2 id="k-largest">K Plus Grands Elements</h2>
<pre><code>def find_k_largest(nums, k):
    import heapq
    # Min heap de taille k
    heap = []
    for num in nums:
        heapq.heappush(heap, num)
        if len(heap) > k:
            heapq.heappop(heap)
    return heap</code></pre>

<h2 id="heap-sort">Tri par Tas</h2>
<pre><code>def heap_sort(nums):
    import heapq
    heapq.heapify(nums)
    result = []
    while nums:
        result.append(heapq.heappop(nums))
    return result</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Min heap vs Max heap pour Top K ?</h4><p><strong>Min heap de taille K</strong> : garde les K plus grands. Quand un element plus grand que le sommet arrive, on remplace. <strong>Max heap</strong> : garde les K plus petits. Min heap est plus efficient car il ne garde que K elements.</p></div>
`},

{id:13,title:"K-Way Merge",module:2,difficulty:"moyen",duration:"20 min",
content:`
<h2 id="definition">Fusionner K Listes Triees</h2>
<p>Utiliser un min heap pour fusionner K listes triees en une seule en O(N log k) ou N est le nombre total d'elements.</p>

<h2 id="merge-k">Fusionner K Listes</h2>
<pre><code>import heapq

def merge_k_sorted_lists(lists):
    heap = []
    
    # Initialiser avec le premier element de chaque liste
    for i, lst in enumerate(lists):
        if lst:
            heapq.heappush(heap, (lst[0], i, 0))
    
    result = []
    while heap:
        val, list_idx, elem_idx = heapq.heappop(heap)
        result.append(val)
        
        if elem_idx + 1 < len(lists[list_idx]):
            next_val = lists[list_idx][elem_idx + 1]
            heapq.heappush(heap, (next_val, list_idx, elem_idx + 1))
    
    return result</code></pre>

<h2 id="median-k">Mediane de K Tableaux</h2>
<pre><code># Fusionner puis trouver la mediane
def median_of_k_arrays(arrays):
    merged = merge_k_sorted_arrays(arrays)
    n = len(merged)
    if n % 2 == 0:
        return (merged[n//2 - 1] + merged[n//2]) / 2
    return merged[n//2]</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : K-Way Merge vs K-Merge classique ?</h4><p><strong>K-Way Merge</strong> : O(N log k) avec heap. <strong>K-Merge classique</strong> (deux a deux) : O(N k log k). K-Way est toujours meilleur quand K > 2.</p></div>
`},

{id:14,title:"Topological Sort",module:2,difficulty:"moyen",duration:"20 min",
content:`
<h2 id="definition">Tri Topologique</h2>
<p>Ordonner les elements d'un graphe oriente acyclique (DAG) de sorte que pour chaque arete (u,v), u apparait avant v. Utile pour les pre-requis, l'ordonnancement de taches.</p>

<h2 id="bfs">Kahn's Algorithm (BFS)</h2>
<pre><code>from collections import deque, defaultdict

def topological_sort(num_courses, prerequisites):
    graph = defaultdict(list)
    in_degree = [0] * num_courses
    
    for dest, src in prerequisites:
        graph[src].append(dest)
        in_degree[dest] += 1
    
    # Commencer par les noeuds sans pre-requis
    queue = deque([i for i in range(num_courses) if in_degree[i] == 0])
    order = []
    
    while queue:
        node = queue.popleft()
        order.append(node)
        
        for neighbor in graph[node]:
            in_degree[neighbor] -= 1
            if in_degree[neighbor] == 0:
                queue.append(neighbor)
    
    return order if len(order) == num_courses else []  # cycle detecte</code></pre>

<h2 id="dfs">DFS Topological Sort</h2>
<pre><code>def topological_sort_dfs(num_courses, prerequisites):
    graph = defaultdict(list)
    for dest, src in prerequisites:
        graph[src].append(dest)
    
    visited = [0] * num_courses  # 0=non visite, 1=en cours, 2=termine
    order = []
    
    def dfs(node):
        visited[node] = 1
        for neighbor in graph[node]:
            if visited[neighbor] == 1:  # cycle
                return False
            if visited[neighbor] == 0:
                if not dfs(neighbor):
                    return False
        visited[node] = 2
        order.append(node)
        return True
    
    for i in range(num_courses):
        if visited[i] == 0:
            if not dfs(i):
                return []
    
    return order[::-1]</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : BFS vs DFS pour le tri topologique ?</h4><p><strong>BFS (Kahn)</strong> : plus intuitif, detecte les cycles facilement, donne l'ordre dans l'ordre de traitement. <strong>DFS</strong> : plus naturel pour la recursion, utile pour les problemes de path finding. Les deux sont O(V+E).</p></div>
`},

{id:15,title:"Matrix Traversal",module:2,difficulty:"moyen",duration:"20 min",
content:`
<h2 id="definition">Parcours de Matrices</h2>
<p>Appliquer BFS ou DFS sur des matrices 2D pour des problemes comme les iles, le pourrissement des oranges, etc.</p>

<h2 id="islands">Nombre d'Iles</h2>
<pre><code>def num_islands(grid):
    if not grid:
        return 0
    
    count = 0
    for i in range(len(grid)):
        for j in range(len(grid[0])):
            if grid[i][j] == '1':
                dfs(grid, i, j)
                count += 1
    return count

def dfs(grid, i, j):
    if i < 0 or i >= len(grid) or j < 0 or j >= len(grid[0]):
        return
    if grid[i][j] != '1':
        return
    
    grid[i][j] = '0'  # marquer comme visite
    dfs(grid, i + 1, j)
    dfs(grid, i - 1, j)
    dfs(grid, i, j + 1)
    dfs(grid, i, j - 1)</code></pre>

<h2 id="rotten-oranges">Rotten Oranges (BFS)</h2>
<pre><code>from collections import deque

def oranges_rotting(grid):
    queue = deque()
    fresh = 0
    
    for i in range(len(grid)):
        for j in range(len(grid[0])):
            if grid[i][j] == 2:
                queue.append((i, j, 0))
            elif grid[i][j] == 1:
                fresh += 1
    
    minutes = 0
    directions = [(0,1),(0,-1),(1,0),(-1,0)]
    
    while queue:
        x, y, time = queue.popleft()
        minutes = max(minutes, time)
        
        for dx, dy in directions:
            nx, ny = x + dx, y + dy
            if 0 <= nx < len(grid) and 0 <= ny < len(grid[0]) and grid[nx][ny] == 1:
                grid[nx][ny] = 2
                fresh -= 1
                queue.append((nx, ny, time + 1))
    
    return minutes if fresh == 0 else -1</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : BFS vs DFS pour les matrices ?</h4><p><strong>BFS</strong> : trouver le plus court chemin, level-by-level processing. <strong>DFS</strong> : compter les composants connectes, plus simple a implementer. BFS est preferred pour les problemes de distance.</p></div>
`},

{id:16,title:"Backtracking",module:2,difficulty:"difficile",duration:"25 min",
content:`
<h2 id="definition">Backtracking</h2>
<p>Le backtracking explore toutes les solutions possibles en construisant les candidats incrementalement et en abandonnant les solutions non viables ("pruning").</p>

<h2 id="template">Template General</h2>
<pre><code>def backtrack(path, choices):
    if condition_de_fin(path):
        result.append(path[:])
        return
    
    for choice in choices:
        if not valable(choice):
            continue
        
        path.append(choice)        # faire le choix
        backtrack(path, nouvelle_liste_de_choix)
        path.pop()                 # annuler le choix (backtrack)</code></pre>

<h2 id="n-queens">N-Queens</h2>
<pre><code>def solve_n_queens(n):
    result = []
    
    def backtrack(queens, xy_sum, xy_diff):
        row = len(queens)
        if row == n:
            result.append(queens[:])
            return
        
        for col in range(n):
            if col in queens or (row + col) in xy_sum or (row - col) in xy_diff:
                continue
            
            queens.append(col)
            backtrack(queens, xy_sum | {row + col}, xy_diff | {row - col})
            queens.pop()
    
    backtrack([], set(), set())
    return result</code></pre>

<h2 id="sudoku">Sudoku Solver</h2>
<pre><code>def solve_sudoku(board):
    def is_valid(row, col, num):
        for i in range(9):
            if board[row][i] == num or board[i][col] == num:
                return False
        box_row, box_col = 3 * (row // 3), 3 * (col // 3)
        for i in range(box_row, box_row + 3):
            for j in range(box_col, box_col + 3):
                if board[i][j] == num:
                    return False
        return True
    
    def solve():
        for i in range(9):
            for j in range(9):
                if board[i][j] == '.':
                    for num in '123456789':
                        if is_valid(i, j, num):
                            board[i][j] = num
                            if solve():
                                return True
                            board[i][j] = '.'
                    return False
        return True
    
    solve()</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Backtracking vs Brute Force ?</h4><p><strong>Brute Force</strong> : genere toutes les combinaisons, pas de pruning. <strong>Backtracking</strong> : abandonne les branches non viablees tot, reduisant le nombre de configurations testees. Backtracking est plus efficace grace au pruning.</p></div>
`},

{id:17,title:"Greedy",module:2,difficulty:"moyen",duration:"20 min",
content:`
<h2 id="definition">Algorithmes Gloutons</h2>
<p>Un algorithme glouton fait le choix localement optimal a chaque etape, esperant trouver le global optimal. Fonctionne quand le probleme a la propriete greedy choice property.</p>

<h2 id="activity">Activity Selection</h2>
<pre><code>def max_activities(activities):
    # Trier par heure de fin
    activities.sort(key=lambda x: x[1])
    
    result = [activities[0]]
    last_end = activities[0][1]
    
    for i in range(1, len(activities)):
        if activities[i][0] >= last_end:
            result.append(activities[i])
            last_end = activities[i][1]
    
    return result</code></pre>

<h2 id="jump-game">Jump Game</h2>
<pre><code>def can_jump(nums):
    max_reach = 0
    for i in range(len(nums)):
        if i > max_reach:
            return False
        max_reach = max(max_reach, i + nums[i])
    return True</code></pre>

<h2 id="partition-labels">Partition Labels</h2>
<pre><code>def partition_labels(s):
    last = {c: i for i, c in enumerate(s)}
    
    result = []
    start = end = 0
    
    for i, c in enumerate(s):
        end = max(end, last[c])
        if i == end:
            result.append(end - start + 1)
            start = end + 1
    
    return result</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Greedy vs Dynamic Programming ?</h4><p><strong>Greedy</strong> : choix local optimal, pas de reconsideration, plus rapide O(n) ou O(n log n). <strong>DP</strong> : considere toutes les options, plus lent mais toujours optimal. Utilisez Greedy quand le probleme a la propriete greedy choice.</p></div>
`},

{id:18,title:"Trie",module:2,difficulty:"moyen",duration:"20 min",
content:`
<h2 id="definition">Trie (Prefix Tree)</h2>
<p>Un Trie est une structure d'arbre pour stocker des chaines de caracteres. Chaque noeud represente un caractere, et les mots sont stockes comme des chemins de la racine aux feuilles.</p>

<h2 id="implementation">Implementation</h2>
<pre><code>class TrieNode:
    def __init__(self):
        self.children = {}
        self.is_end = False

class Trie:
    def __init__(self):
        self.root = TrieNode()
    
    def insert(self, word):
        node = self.root
        for char in word:
            if char not in node.children:
                node.children[char] = TrieNode()
            node = node.children[char]
        node.is_end = True
    
    def search(self, word):
        node = self.root
        for char in word:
            if char not in node.children:
                return False
            node = node.children[char]
        return node.is_end
    
    def starts_with(self, prefix):
        node = self.root
        for char in prefix:
            if char not in node.children:
                return False
            node = node.children[char]
        return True</code></pre>

<h2 id="autocomplete">Autocomplete</h2>
<pre><code>def autocomplete(trie, prefix):
    node = trie.root
    for char in prefix:
        if char not in node.children:
            return []
        node = node.children[char]
    
    results = []
    def dfs(node, current):
        if node.is_end:
            results.append(prefix + current)
        for char, child in node.children.items():
            dfs(child, current + char)
    
    dfs(node, "")
    return results</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Trie vs Hash Map pour le prefix matching ?</h4><p><strong>Trie</strong> : O(m) pour le prefix matching, espace partage. <strong>Hash Map</strong> : O(m) pour exact match, O(n*m) pour prefix. Le Trie est meilleur pour les operations de prefix et l'autocomplete.</p></div>
`},

{id:19,title:"Union-Find",module:2,difficulty:"moyen",duration:"20 min",
content:`
<h2 id="definition">Union-Find (Disjoint Set)</h2>
<p>Union-Find gere un ensemble d'elements partitionnes en sous-ensembles disjoints. Operations : Find (trouver le representant) et Union (fusionner deux ensembles).</p>

<h2 id="implementation">Implementation Optimisee</h2>
<pre><code>class UnionFind:
    def __init__(self, n):
        self.parent = list(range(n))
        self.rank = [0] * n
        self.components = n
    
    def find(self, x):
        if self.parent[x] != x:
            self.parent[x] = self.find(self.parent[x])  # path compression
        return self.parent[x]
    
    def union(self, x, y):
        px, py = self.find(x), self.find(y)
        if px == py:
            return False
        
        # Union by rank
        if self.rank[px] < self.rank[py]:
            px, py = py, px
        self.parent[py] = px
        if self.rank[px] == self.rank[py]:
            self.rank[px] += 1
        
        self.components -= 1
        return True
    
    def connected(self, x, y):
        return self.find(x) == self.find(y)</code></pre>

<h2 id="composants">Composants Connectes</h2>
<pre><code>def count_components(n, edges):
    uf = UnionFind(n)
    for u, v in edges:
        uf.union(u, v)
    return uf.components</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Quand utiliser Union-Find ?</h4><p>Problemes de connectivite : 1) Composants connectes dans un graphe. 2) Detection de cycle dans un graphe non-oriente. 3) Percolation (connexite water-merge). 4) Kruskal's MST.</p></div>
`},

{id:20,title:"Bit Manipulation",module:2,difficulty:"moyen",duration:"20 min",
content:`
<h2 id="definition">Manipulation de Bits</h2>
<p>Les operations bit a bit sont tres performantes et utiles pour : trouver l'element unique, gerer des ensembles, optimiser l'espace.</p>

<h2 id="operations">Operations de Base</h2>
<pre><code># XOR - annule un nombre avec lui-meme
a ^ a = 0
a ^ 0 = a

# Trouver l'element unique (tous apparaissent 2 fois sauf un)
def single_number(nums):
    result = 0
    for num in nums:
        result ^= num
    return result

# AND - masquer des bits
n & (n-1)  # supprime le bit de poids faible

# Compter les bits a 1
def count_bits(n):
    count = 0
    while n:
        n &= n - 1
        count += 1
    return count</code></pre>

<h2 id="subsets-bits">Generer les sous-ensembles avec des bits</h2>
<pre><code>def subsets_bits(nums):
    n = len(nums)
    result = []
    for mask in range(1 << n):  # 0 a 2^n - 1
        subset = []
        for i in range(n):
            if mask & (1 << i):
                subset.append(nums[i])
        result.append(subset)
    return result</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Quand utiliser XOR ?</h4><p>1) Trouver l'element unique. 2) Inverser les bits. 3) Verifier la parity. 4) Echanger deux valeurs sans variable temporaire. 5) Generer le masque de bits.</p></div>
`},

{id:21,title:"Kadane's Algorithm",module:3,difficulty:"moyen",duration:"15 min",
content:`
<h2 id="definition">Sous-tableau Maximum</h2>
<p>Kadane's Algorithm trouve le sous-tableau continu avec la plus grande somme en O(n).</p>

<h2 id="basic">Version de Base</h2>
<pre><code>def max_subarray(nums):
    max_sum = current_sum = nums[0]
    
    for num in nums[1:]:
        current_sum = max(num, current_sum + num)
        max_sum = max(max_sum, current_sum)
    
    return max_sum</code></pre>

<h2 id="circular">Sous-tableau Maximum Circulaire</h2>
<pre><code>def max_subarray_circular(nums):
    total = 0
    max_sum = current_max = nums[0]
    min_sum = current_min = nums[0]
    
    for num in nums[1:]:
        current_max = max(num, current_max + num)
        max_sum = max(max_sum, current_max)
        current_min = min(num, current_min + num)
        min_sum = min(min_sum, current_min)
        total += num
    
    # Si tous les elements sont negatifs
    if max_sum < 0:
        return max_sum
    
    return max(max_sum, total - min_sum)</code></pre>

<h2 id="complexite">Complexite</h2>
<div class="formula">Temps : O(n) | Espace : O(1)</div>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Comment reconaitre un probleme Kadane ?</h4><p>Sous-tableau continu, chercher la somme max/min. Variantes : maximum product subarray (garder min et max), maximum sum circular, maximum sum k-subarray.</p></div>
`},

{id:22,title:"Monotonic Stack",module:3,difficulty:"moyen",duration:"15 min",
content:`
<h2 id="definition">Monotonic Stack</h2>
<p>Un stack monotone maintient ses elements en ordre croissant ou decroissant. Utile pour trouver le prochain element plus grand/petit en O(n).</p>

<h2 id="next-greater">Prochain Element Plus Grand</h2>
<pre><code>def next_greater_element(nums):
    n = len(nums)
    result = [-1] * n
    stack = []
    
    for i in range(n):
        while stack and nums[i] > nums[stack[-1]]:
            result[stack.pop()] = nums[i]
        stack.append(i)
    
    return result</code></pre>

<h2 id="temperatures">Daily Temperatures</h2>
<pre><code>def daily_temperatures(temperatures):
    n = len(temperatures)
    result = [0] * n
    stack = []
    
    for i in range(n):
        while stack and temperatures[i] > temperatures[stack[-1]]:
            prev = stack.pop()
            result[prev] = i - prev
        stack.append(i)
    
    return result</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Monotonic stack - quand l'utiliser ?</h4><p>Problemes : 1) Prochain element plus grand/petit. 2) Largest rectangle in histogram. 3) Trapping rain water. 4) Sliding window maximum.</p></div>
`},

{id:23,title:"Prefix Sum",module:3,difficulty:"facile",duration:"15 min",
content:`
<h2 id="definition">Somme Prefixe</h2>
<p>Le prefix sum pre-calcule les sommes cumulees pour repondre aux requetes de somme de sous-tableaux en O(1).</p>

<h2 id="implementation">Implementation</h2>
<pre><code># Construction
def build_prefix_sum(nums):
    prefix = [0] * (len(nums) + 1)
    for i in range(len(nums)):
        prefix[i + 1] = prefix[i] + nums[i]
    return prefix

# Somme de nums[i] a nums[j]
def range_sum(prefix, i, j):
    return prefix[j + 1] - prefix[i]</code></pre>

<h2 id="subarray-sum">Sous-tableau Somme = K</h2>
<pre><code>def subarray_sum(nums, k):
    count = 0
    prefix = 0
    prefix_map = {0: 1}
    
    for num in nums:
        prefix += num
        if prefix - k in prefix_map:
            count += prefix_map[prefix - k]
        prefix_map[prefix] = prefix_map.get(prefix, 0) + 1
    
    return count</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Prefix Sum vs Sliding Window ?</h4><p><strong>Prefix Sum</strong> : requetes de somme de range, sous-tableaux avec somme = k. <strong>Sliding Window</strong> : sous-tableaux de taille fixe ou variable, max/min. Prefix Sum est meilleur pour les sommes, Sliding Window pour les contraintes de taille.</p></div>
`},

{id:24,title:"DP 1D",module:3,difficulty:"moyen",duration:"25 min",
content:`
<h2 id="definition">Programmation Dynamique 1D</h2>
<p>DP 1D resout des problemes en stockant les sous-solutions dans un tableau 1D. Chaque etape depend des etapes precedentes.</p>

<h2 id="climbing-stairs">Escaliers (Climbing Stairs)</h2>
<pre><code>def climb_stairs(n):
    if n <= 2:
        return n
    
    dp = [0] * (n + 1)
    dp[1] = 1
    dp[2] = 2
    
    for i in range(3, n + 1):
        dp[i] = dp[i-1] + dp[i-2]
    
    return dp[n]

# Optimisation O(1) espace
def climb_stairs_optimized(n):
    if n <= 2:
        return n
    a, b = 1, 2
    for _ in range(3, n + 1):
        a, b = b, a + b
    return b</code></pre>

<h2 id="house-robber">Cambrioleur</h2>
<pre><code>def rob(nums):
    if not nums:
        return 0
    if len(nums) == 1:
        return nums[0]
    
    dp = [0] * len(nums)
    dp[0] = nums[0]
    dp[1] = max(nums[0], nums[1])
    
    for i in range(2, len(nums)):
        dp[i] = max(dp[i-1], dp[i-2] + nums[i])
    
    return dp[-1]</code></pre>

<h2 id="coin-change">Coin Change</h2>
<pre><code>def coin_change(coins, amount):
    dp = [float('inf')] * (amount + 1)
    dp[0] = 0
    
    for coin in coins:
        for i in range(coin, amount + 1):
            dp[i] = min(dp[i], dp[i - coin] + 1)
    
    return dp[amount] if dp[amount] != float('inf') else -1</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Comment reconnaitre un probleme DP 1D ?</h4><p>1) Sous-problemes optimises. 2) Choix a chaque etape. 3) Pas de structure de donnees complexe (juste un tableau). 4) La solution depend des solutions precedentes (recurrence).</p></div>
`},

{id:25,title:"DP 2D",module:3,difficulty:"difficile",duration:"25 min",
content:`
<h2 id="definition">Programmation Dynamique 2D</h2>
<p>DP 2D resout des problemes avec deux dimensions (deux chaines, deux tableaux, grille).</p>

<h2 id="lcs">Plus Longue Sous-Sequence Commune</h2>
<pre><code>def longest_common_subsequence(text1, text2):
    m, n = len(text1), len(text2)
    dp = [[0] * (n + 1) for _ in range(m + 1)]
    
    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if text1[i-1] == text2[j-1]:
                dp[i][j] = dp[i-1][j-1] + 1
            else:
                dp[i][j] = max(dp[i-1][j], dp[i][j-1])
    
    return dp[m][n]</code></pre>

<h2 id="edit-distance">Distance d'Edition</h2>
<pre><code>def min_distance(word1, word2):
    m, n = len(word1), len(word2)
    dp = [[0] * (n + 1) for _ in range(m + 1)]
    
    for i in range(m + 1):
        dp[i][0] = i
    for j in range(n + 1):
        dp[0][j] = j
    
    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if word1[i-1] == word2[j-1]:
                dp[i][j] = dp[i-1][j-1]
            else:
                dp[i][j] = 1 + min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1])
    
    return dp[m][n]</code></pre>

<h2 id="knapsack">Sac a Dos</h2>
<pre><code>def knapsack(weights, values, capacity):
    n = len(weights)
    dp = [[0] * (capacity + 1) for _ in range(n + 1)]
    
    for i in range(1, n + 1):
        for w in range(capacity + 1):
            dp[i][w] = dp[i-1][w]
            if weights[i-1] <= w:
                dp[i][w] = max(dp[i][w], dp[i-1][w-weights[i-1]] + values[i-1])
    
    return dp[n][capacity]</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Comment optimiser de 2D a 1D en DP ?</h4><p>Quand dp[i] ne depend que de dp[i-1], on peut utiliser un seul tableau. Parcourir dans le bon sens (gauche a droite ou droite a gauche selon le probleme). Espace : O(n*m) -> O(m).</p></div>
`},

{id:26,title:"DP Knapsack",module:3,difficulty:"difficile",duration:"25 min",
content:`
<h2 id="definition">Variations du Knapsack</h2>
<p>Le sac a dos est un template pour de nombreux problemes d'optimisation : choisir des objets avec contrainte de poids/capacite.</p>

<h2 id="01knapsack">0/1 Knapsack</h2>
<pre><code>def knapsack_01(weights, values, capacity):
    n = len(weights)
    dp = [0] * (capacity + 1)
    
    for i in range(n):
        for w in range(capacity, weights[i] - 1, -1):
            dp[w] = max(dp[w], dp[w - weights[i]] + values[i])
    
    return dp[capacity]</code></pre>

<h2 id="unbounded">Unbounded Knapsack</h2>
<pre><code>def knapsack_unbounded(weights, values, capacity):
    dp = [0] * (capacity + 1)
    
    for w in range(1, capacity + 1):
        for i in range(len(weights)):
            if weights[i] <= w:
                dp[w] = max(dp[w], dp[w - weights[i]] + values[i])
    
    return dp[capacity]</code></pre>

<h2 id="subset-sum">Subset Sum</h2>
<pre><code>def subset_sum(nums, target):
    dp = [False] * (target + 1)
    dp[0] = True
    
    for num in nums:
        for i in range(target, num - 1, -1):
            dp[i] = dp[i] or dp[i - num]
    
    return dp[target]</code></pre>

<h2 id="target-sum">Target Sum</h2>
<pre><code>def find_target_sum_ways(nums, target):
    total = sum(nums)
    if (total + target) % 2 != 0 or abs(target) > total:
        return 0
    
    subset_sum = (total + target) // 2
    
    dp = [0] * (subset_sum + 1)
    dp[0] = 1
    
    for num in nums:
        for i in range(subset_sum, num - 1, -1):
            dp[i] += dp[i - num]
    
    return dp[subset_sum]</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : 0/1 vs Unbounded Knapsack ?</h4><p><strong>0/1</strong> : chaque element utilise au plus une fois (parcourir a l'envers). <strong>Unbounded</strong> : chaque element utilise un nombre illimite de fois (parcourir dans le sens croissant).</p></div>
`},

{id:27,title:"DP on Strings",module:3,difficulty:"difficile",duration:"25 min",
content:`
<h2 id="definition">DP sur Chaines de Caracteres</h2>
<p>Les problemes DP sur les chaines comparent ou transforment des chaines. Utilise generalement un tableau 2D dp[i][j] representant les sous-chaines s1[0:i] et s2[0:j].</p>

<h2 id="longest-palindrome">Plus Longue Sous-Chaine Palindrome</h2>
<pre><code>def longest_palindrome(s):
    n = len(s)
    dp = [[False] * n for _ in range(n)]
    start, max_len = 0, 1
    
    for i in range(n):
        dp[i][i] = True
    
    for length in range(2, n + 1):
        for i in range(n - length + 1):
            j = i + length - 1
            if s[i] == s[j]:
                if length <= 3 or dp[i+1][j-1]:
                    dp[i][j] = True
                    if length > max_len:
                        start, max_len = i, length
    
    return s[start:start + max_len]</code></pre>

<h2 id="word-break">Word Break</h2>
<pre><code>def word_break(s, word_dict):
    n = len(s)
    dp = [False] * (n + 1)
    dp[0] = True
    
    for i in range(1, n + 1):
        for word in word_dict:
            if len(word) <= i and dp[i - len(word)] and s[i-len(word):i] == word:
                dp[i] = True
                break
    
    return dp[n]</code></pre>

<h2 id="regex-matching">Regex Matching</h2>
<pre><code>def is_match(s, p):
    m, n = len(s), len(p)
    dp = [[False] * (n + 1) for _ in range(m + 1)]
    dp[0][0] = True
    
    for j in range(2, n + 1):
        if p[j-1] == '*':
            dp[0][j] = dp[0][j-2]
    
    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if p[j-1] == '*':
                dp[i][j] = dp[i][j-2]
                if p[j-2] == '.' or p[j-2] == s[i-1]:
                    dp[i][j] = dp[i][j] or dp[i-1][j]
            elif p[j-1] == '.' or p[j-1] == s[i-1]:
                dp[i][j] = dp[i-1][j-1]
    
    return dp[m][n]</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Comment aborder un probleme DP sur les chaines ?</h4><p>1) Definir dp[i][j] = resultat pour s1[0:i] et s2[0:j]. 2) Trouver la relation de recurrence. 3) Cas de base (chaîne vide). 4) Parcourir dans le bon ordre. 5) Optimiser l'espace si possible.</p></div>
`},

{id:28,title:"DP on Trees",module:3,difficulty:"difficile",duration:"25 min",
content:`
<h2 id="definition">DP sur les Arbres</h2>
<p>La DP sur les arbres resout des problemes en calculant les sous-solutions pour chaque sous-arbre, puis en les combinant.</p>

<h2 id="diameter">Diametre de l'Arbre</h2>
<pre><code>def diameter_of_binary_tree(root):
    diameter = 0
    
    def depth(node):
        nonlocal diameter
        if not node:
            return 0
        
        left = depth(node.left)
        right = depth(node.right)
        diameter = max(diameter, left + right)
        
        return 1 + max(left, right)
    
    depth(root)
    return diameter</code></pre>

<h2 id="path-sum">Path Sum III</h2>
<pre><code>def path_sum(root, target_sum):
    def dfs(node, current_sum):
        if not node:
            return 0
        
        current_sum += node.val
        count = prefix_sums.get(current_sum - target_sum, 0)
        
        prefix_sums[current_sum] = prefix_sums.get(current_sum, 0) + 1
        count += dfs(node.left, current_sum)
        count += dfs(node.right, current_sum)
        prefix_sums[current_sum] -= 1
        
        return count
    
    prefix_sums = {0: 1}
    return dfs(root, 0)</code></pre>

<h2 id="bst-validation">Validation BST</h2>
<pre><code>def is_valid_bst(root):
    def validate(node, low=float('-inf'), high=float('inf')):
        if not node:
            return True
        if node.val <= low or node.val >= high:
            return False
        return (validate(node.left, low, node.val) and
                validate(node.right, node.val, high))
    
    return validate(root)</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Comment faire de la DP sur les arbres ?</h4><p>1) Post-order traversal (traiter les enfants avant le parent). 2) Calculer la solution pour chaque sous-arbre. 3) Combiner les solutions des enfants pour le parent. 4) Stocker les resultats pour eviter les recalculs.</p></div>
`},

{id:29,title:"Dijkstra",module:3,difficulty:"difficile",duration:"25 min",
content:`
<h2 id="definition">Algorithme de Dijkstra</h2>
<p>Dijkstra trouve le plus court chemin depuis une source vers tous les autres noeuds dans un graphe avec des poids positifs. Utilise une file a priorite (min heap).</p>

<h2 id="implementation">Implementation</h2>
<pre><code>import heapq
from collections import defaultdict

def dijkstra(graph, start):
    distances = {node: float('inf') for node in graph}
    distances[start] = 0
    pq = [(0, start)]
    previous = {node: None for node in graph}
    
    while pq:
        current_dist, current = heapq.heappop(pq)
        
        if current_dist > distances[current]:
            continue
        
        for neighbor, weight in graph[current]:
            distance = current_dist + weight
            
            if distance < distances[neighbor]:
                distances[neighbor] = distance
                previous[neighbor] = current
                heapq.heappush(pq, (distance, neighbor))
    
    return distances, previous

# Reconstruire le chemin
def reconstruct_path(previous, target):
    path = []
    current = target
    while current:
        path.append(current)
        current = previous[current]
    return path[::-1]</code></pre>

<h2 id="complexite">Complexite</h2>
<div class="formula">Temps : O((V + E) log V) avec un min heap | Espace : O(V)</div>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Dijkstra vs Bellman-Ford vs Floyd-Warshall ?</h4><p><strong>Dijkstra</strong> : source unique, poids positifs, O((V+E) log V). <strong>Bellman-Ford</strong> : source unique, poids negatifs, O(VE). <strong>Floyd-Warshall</strong> : tous les paires, poids negatifs, O(V³).</p></div>
<div class="qa"><h4>Q2 : Pourquoi pas de poids negatifs avec Dijkstra ?</h4><p>Dijkstra suppose que chaque fois qu'on visite un noeud, on a trouve le plus court chemin. Avec des poids negatifs, un chemin plus long (en nombre d'aretes) pourrait etre plus court en poids total, violant cette hypothese.</p></div>
`},

{id:30,title:"Bellman-Ford",module:3,difficulty:"difficile",duration:"20 min",
content:`
<h2 id="definition">Algorithme de Bellman-Ford</h2>
<p>Bellman-Ford trouve le plus court chemin depuis une source, meme avec des poids negatifs. Il detecte aussi les cycles de poids negatif.</p>

<h2 id="implementation">Implementation</h2>
<pre><code>def bellman_ford(n, edges, source):
    distances = [float('inf')] * n
    distances[source] = 0
    
    # Relacher toutes les aretes n-1 fois
    for _ in range(n - 1):
        for u, v, weight in edges:
            if distances[u] != float('inf') and distances[u] + weight < distances[v]:
                distances[v] = distances[u] + weight
    
    # Detecter les cycles de poids negatif
    for u, v, weight in edges:
        if distances[u] != float('inf') and distances[u] + weight < distances[v]:
            return None  # cycle negatif detecte
    
    return distances</code></pre>

<h2 id="negative-cycle">Detection de Cycle Negatif</h2>
<pre><code>def has_negative_cycle(n, edges, source):
    distances = [0] * n
    
    for _ in range(n - 1):
        for u, v, weight in edges:
            if distances[u] + weight < distances[v]:
                distances[v] = distances[u] + weight
    
    for u, v, weight in edges:
        if distances[u] + weight < distances[v]:
            return True
    
    return False</code></pre>

<h2 id="complexite">Complexite</h2>
<div class="formula">Temps : O(VE) | Espace : O(V)</div>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Quand utiliser Bellman-Ford vs Dijkstra ?</h4><p><strong>Bellman-Ford</strong> : poids negatifs, detection de cycles negatifs, plus lent O(VE). <strong>Dijkstra</strong> : poids positifs uniquement, plus rapide O((V+E) log V). Utilisez Dijkstra par defaut, Bellman-Ford quand il y a des poids negatifs.</p></div>
`},

{id:31,title:"Floyd-Warshall",module:3,difficulty:"difficile",duration:"20 min",
content:`
<h2 id="definition">Tous les Plus Courts Chemins</h2>
<p>Floyd-Warshall calcule les plus courts chemins entre toutes les paires de noeuds en O(V³). Gere les poids negatifs (pas les cycles negatifs).</p>

<h2 id="implementation">Implementation</h2>
<pre><code>def floyd_warshall(n, edges):
    # Initialiser la matrice de distances
    dist = [[float('inf')] * n for _ in range(n)]
    for i in range(n):
        dist[i][i] = 0
    
    for u, v, w in edges:
        dist[u][v] = w
    
    # Algorithme
    for k in range(n):        # noeud intermediaire
        for i in range(n):    # source
            for j in range(n):  # destination
                if dist[i][k] + dist[k][j] < dist[i][j]:
                    dist[i][j] = dist[i][k] + dist[k][j]
    
    return dist</code></pre>

<h2 id="transitive-closure">Fermeture Transitive</h2>
<pre><code>def transitive_closure(n, edges):
    # Reachable[i][j] = True si j est accessible depuis i
    reachable = [[False] * n for _ in range(n)]
    
    for i in range(n):
        reachable[i][i] = True
    for u, v in edges:
        reachable[u][v] = True
    
    for k in range(n):
        for i in range(n):
            for j in range(n):
                reachable[i][j] = reachable[i][j] or (reachable[i][k] and reachable[k][j])
    
    return reachable</code></pre>

<h2 id="complexite">Complexite</h2>
<div class="formula">Temps : O(V³) | Espace : O(V²)</div>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Floyd-Warshall vs Dijkstra pour tous les paires ?</h4><p><strong>Floyd-Warshall</strong> : O(V³), simple, gere les poids negatifs. <strong>Dijkstra x V</strong> : O(V(V+E) log V), plus rapide pour les graphes eparses. Floyd-Warshall est meilleur pour les graphes denses, Dijkstra pour les graphes eparses.</p></div>

function getProgress(){return JSON.parse(localStorage.getItem('dsa_progress')||'{}')}
function setProgress(id,val){const p=getProgress();p[id]=val;localStorage.setItem('dsa_progress',JSON.stringify(p))}

function getLesson(id){return LESSONS.find(l=>l.id===id)}
function getModuleForLesson(id){return MODULES.find(m=>m.lessons.includes(id))}
function getLessonIndex(id){return LESSONS.findIndex(l=>l.id===id)}

function renderSidebar(currentId){
  const progress=getProgress();
  const completed=Object.values(progress).filter(v=>v).length;
  const total=LESSONS.length;
  let html=`
  <div class="sidebar-box">
    <h4>Progression</h4>
    <div class="progress-bar"><div class="progress-fill" style="width:${(completed/total)*100}%"></div></div>
    <p class="progress-text">${completed}/${total} lecons completees</p>
  </div>`;
  
  MODULES.forEach(mod=>{
    const isOpen=getModuleForLesson(currentId)?.id===mod.id;
    html+=`<div class="sidebar-box">
      <h4 class="module-toggle ${isOpen?'':'collapsed'}" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed')">Module ${mod.id}: ${mod.name}</h4>
      <div class="module-lessons ${isOpen?'':'collapsed'}" style="max-height:${mod.lessons.length*40}px">`;
    mod.lessons.forEach(lid=>{
      const lesson=getLesson(lid);
      const isCurrent=lid===currentId;
      const isCompleted=progress[lid];
      html+=`<a class="lesson-link ${isCurrent?'active':''} ${isCompleted?'completed':''}" href="?id=${lid}">
        <span class="check">&#10003;</span> ${lid}. ${lesson.title}
      </a>`;
    });
    html+=`</div></div>`;
  });
  return html;
}

function renderNav(currentId){
  const idx=getLessonIndex(currentId);
  let html='';
  if(idx>0){
    const prev=LESSONS[idx-1];
    html+=`<a href="?id=${prev.id}"><span>&#8592; Lecon precedente</span>${prev.title}</a>`;
  }else{html+=`<div></div>`}
  if(idx<LESSONS.length-1){
    const next=LESSONS[idx+1];
    html+=`<a href="?id=${next.id}" style="text-align:right"><span>Lecon suivante &#8594;</span>${next.title}</a>`;
  }
  return html;
}

function init(){
  const params=new URLSearchParams(window.location.search);
  const id=parseInt(params.get('id'))||1;
  const lesson=getLesson(id);
  if(!lesson){document.getElementById('lesson-content').innerHTML='<p>Lecon non trouvee.</p>';return}
  const mod=getModuleForLesson(id);
  
  document.getElementById('breadcrumb').innerHTML=`<a href="/">Accueil</a> / <a href="/pages/dsa.html">DSA</a> / Module ${mod.id} / ${lesson.title}`;
  document.getElementById('lesson-title').textContent=lesson.title;
  document.getElementById('lesson-meta').innerHTML=`
    <span class="meta-item">Module ${mod.id} : ${mod.name}</span>
    <span class="meta-item">Lecon ${id}/${LESSONS.length}</span>
    <span class="meta-item">${lesson.duration}</span>
    <span class="badge badge-${lesson.difficulty}">${lesson.difficulty.charAt(0).toUpperCase()+lesson.difficulty.slice(1)}</span>`;
  document.getElementById('lesson-content').innerHTML=lesson.content;
  document.getElementById('nav-lesson').innerHTML=renderNav(id);
  document.getElementById('sidebar').innerHTML=renderSidebar(id);
  
  setProgress(id,true);
  renderSidebar(id);
  
  const toc=document.querySelectorAll('.toc a');
  const sections=document.querySelectorAll('h2[id]');
  window.addEventListener('scroll',()=>{
    let current='';
    sections.forEach(s=>{if(window.scrollY>=s.offsetTop-100)current=s.id});
    toc.forEach(a=>{a.classList.toggle('active',a.getAttribute('href')==='#'+current)});
  });
}
init();
</script>
