}</code></pre>

<h2 id="rbac">RBAC Azure</h2>
<ul>
<li><strong>Owner</strong> : controle total</li>
<li><strong>Contributor</strong> : tout sauf gestion des acces</li>
<li><strong>Reader</strong> : lecture seule</li>
<li><strong>Custom roles</strong> : permissions specifiques</li>
</ul>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Azure vs AWS pour une entreprise Microsoft ?</h4><p>Azure s'integre nativement avec : Active Directory, Office 365, .NET, Visual Studio, DevOps. Pour les entreprises Microsoft, Azure est souvent le choix naturel. AWS est plus polyvalent et a plus de services.</p></div>
`},

{id:27,title:"Architecture Serverless",module:3,difficulty:"difficile",duration:"25 min",
content:`
<h2 id="definition">Serverless Computing</h2>
<p>Le serverless delegue la gestion de l'infrastructure au provider. Vous payez uniquement pour l'execution :</p>
<div class="callout"><strong>Principe :</strong> Pas de serveurs a gerer, auto-scaling automatique, paiement a l'usage. Lambda (AWS), Cloud Functions (GCP), Functions (Azure).</div>

<h2 id="lambda">Lambda / Cloud Functions</h2>
<pre><code>// AWS Lambda - Node.js
exports.handler = async (event) => {
  const body = JSON.parse(event.body);
  
  const result = await dynamodb.put({
    TableName: process.env.TABLE_NAME,
    Item: {
      id: uuid(),
      ...body,
      createdAt: new Date().toISOString()
    }
  }).promise();
  
  return {
    statusCode: 201,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(result)
  };
};</code></pre>

<h2 id="api-gateway">API Gateway</h2>
<pre><code># AWS API Gateway + Lambda
resource "aws_apigatewayv2_api" "main" {
  name = "mon-api"
  protocol_type = "HTTP"
}

resource "aws_apigatewayv2_integration" "lambda" {
  api_id                 = aws_apigatewayv2_api.main.id
  integration_type       = "AWS_PROXY"
  integration_uri        = aws_lambda_function.main.invoke_arn
  payload_format_version = "2.0"
}

resource "aws_apigatewayv2_route" "post" {
  api_id    = aws_apigatewayv2_api.main.id
  route_key = "POST /items"
  target    = "integrations/${aws_apigatewayv2_integration.lambda.id}"
}</code></pre>

<h2 id="event-driven">Event-Driven Architecture</h2>
<p>Le serverless excelle dans les architectures event-driven :</p>
<ul>
<li><strong>SNS/SQS</strong> : messaging asynchrone</li>
<li><strong>EventBridge</strong> : routage d'evenements</li>
<li><strong>S3 events</strong> : declenchement sur upload</li>
<li><strong>DynamoDB Streams</strong> : changements de donnees</li>
<li><strong>Kinesis</strong> : streaming de donnees</li>
</ul>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Quand utiliser serverless vs containers ?</h4><p><strong>Serverless</strong> : charges irregulieres, APIs, evenements, prototypage rapide. <strong>Containers</strong> : charges constantes, workloads longues, microservices complexes, controle total. Serverless est plus simple mais peut devenir cher a haute echelle.</p></div>
<div class="qa"><h4>Q2 : Comment gerer le cold start ?</h4><p>1) Provisioned concurrency (AWS). 2) Min instances (GCP). 3) Keep-warm avec CloudWatch Events. 4) Reduire la taille du package. 5) Languages plus rapides (Go, Rust). 6) Architecture async pour tolerer la latence.</p></div>
`},

{id:28,title:"Service Mesh",module:3,difficulty:"difficile",duration:"25 min",
content:`
<h2 id="definition">Qu'est-ce qu'un Service Mesh ?</h2>
<p>Un service mesh est une couche d'infrastructure qui gere la communication entre microservices de maniere transparente :</p>
<div class="callout"><strong>Probleme resolu :</strong> Quand vous avez des dizaines de microservices, gerer le load balancing, la securite, l'observabilite et le routage devient complexe. Le service mesh externalise ces preoccupations.</div>

<h2 id="istio">Istio</h2>
<pre><code># Istio - VirtualService pour routage
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: mon-app
spec:
  hosts:
    - mon-app
  http:
    - match:
        - headers:
            x-version:
              exact: "v2"
      route:
        - destination:
            host: mon-app
            subset: v2
    - route:
        - destination:
            host: mon-app
            subset: v1
          weight: 90
        - destination:
            host: mon-app
            subset: v2
          weight: 10</code></pre>

<h2 id="envoy">Envoy Proxy</h2>
<p>Envoy est le sidecar proxy utilise par Istio :</p>
<ul>
<li><strong>Load balancing</strong> : round robin, least request, random</li>
<li><strong>Circuit breaking</strong> : protection contre les cascades d'echecs</li>
<li><strong>Retries</strong> : tentatives automatiques</li>
<li><strong>Timeout</strong> : delais configurables</li>
<li><strong>MTLS</strong> : chiffrement mutuel</li>
</ul>

<h2 id="sidecar">Sidecar Pattern</h2>
<pre><code># Injection automatique Istio
kubectl label namespace default istio-injection=enabled

# Le sidecar est ajoute automatiquement a chaque pod
# Le traffic passe par Envoy avant d'atteindre le conteneur</code></pre>

<h2 id="traffic">Traffic Management</h2>
<ul>
<li><strong>Canary</strong> : deploiement progressif par weight</li>
<li><strong>A/B testing</strong> : routage par headers</li>
<li><strong>Fault injection</strong> : simulation de pannes</li>
<li><strong>Rate limiting</strong> : protection contre le abuse</li>
</ul>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Quand utiliser un service mesh ?</h4><p>Quand vous avez : 10+ microservices, besoin de mTLS, observabilite fine, traffic management avance, politiques de securite. Pour de petits systemes, c'est de la surcomplexite. Commencez sans, ajoutez quand le besoin se presente.</p></div>
<div class="qa"><h4>Q2 : Istio vs Linkerd ?</h4><p><strong>Istio</strong> : plus complet, plus complexe, plus de resources. <strong>Linkerd</strong> : plus simple, plus leger, plus facile a demarrer. Istio est le standard enterprise. Linkerd est excellent pour les petites equipes.</p></div>
`},

{id:29,title:"Observabilite",module:3,difficulty:"difficile",duration:"25 min",
content:`
<h2 id="definition">Les 3 Piliers</h2>
<p>L'observabilite repose sur 3 piliers :</p>
<ul>
<li><strong>Logs</strong> : evenements ponctuels (quoi s'est passe)</li>
<li><strong>Metrics</strong> : mesures numeriques (combien, a quelle vitesse)</li>
<li><strong>Traces</strong> : parcours d'une requete (ou, quand, sequence)</li>
</ul>

<h2 id="logs">Logs et ELK Stack</h2>
<p>ELK = Elasticsearch + Logstash + Kibana :</p>
<pre><code># Fluentd configuration
<source>
  @type tail
  path /var/log/app/*.log
  pos_file /var/log/fluentd/app.log.pos
  tag app.logs
  <parse>
    @type json
  </parse>
</source>

<match app.logs>
  @type elasticsearch
  host elasticsearch
  port 9200
  index_name app-logs
</match></code></pre>

<h2 id="traces">Distributed Tracing</h2>
<p>Jaeger et OpenTelemetry pour le tracing distribue :</p>
<pre><code>// OpenTelemetry - Node.js
const { NodeTracerProvider } = require('@opentelemetry/sdk-trace-node');
const { JaegerExporter } = require('@opentelemetry/exporter-jaeger');

const provider = new NodeTracerProvider();
const exporter = new JaegerExporter({
  endpoint: 'http://jaeger:14268/api/traces'
});

provider.addSpanProcessor(new BatchSpanProcessor(exporter));</code></pre>

<h2 id="opentelemetry">OpenTelemetry</h2>
<p>OpenTelemetry standardise la collecte de telemetrie :</p>
<ul>
<li><strong>Auto-instrumentation</strong> : sans modifier le code</li>
<li><strong>SDK</strong> : pour une instrumentation personnalisee</li>
<li><strong>Collector</strong> : pipeline de traitement</li>
<li><strong>Export</strong> : vers Jaeger, Prometheus, Datadog, etc.</li>
</ul>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Comment implementer l'observabilite dans une microservice architecture ?</h4><p>1) OpenTelemetry pour standardiser. 2) Structured logging (JSON). 3) Metrics avec Prometheus. 4) Tracing avec Jaeger. 5) Dashboards Grafana. 6) Alerting avec Prometheus/AlertManager. 7) Correlation ID pour relier logs/metrics/traces.</p></div>
<div class="qa"><h4>Q2 : Logs structurés vs logs en texte brut ?</h4><p><strong>JSON structuré</strong> : recherche facettee, parsing automatique, compatible ELK. <strong>Texte brut</strong> : lisible humainement, mais difficile a analyser. Toujours utiliser le JSON en production avec des champs standardises (timestamp, level, message, traceId).</p></div>
`},

<h2 id="iam-policies">IAM Policies</h2>
<p>Les politiques IAM definissent les permissions :</p>
<pre><code># AWS IAM Policy - Moindre privilege
{
  "Version": "2012-10-17",
  "Statement": [
    {
      "Effect": "Allow",
      "Action": [
        "s3:GetObject",
        "s3:PutObject"

      "Resource": "arn:aws:s3:::mon-bucket/*"

    {
      "Effect": "Deny",
      "Action": "s3:DeleteBucket",
      "Resource": "arn:aws:s3:::mon-bucket"
    }
  ]

<h2 id="rbac-cloud">RBAC</h2>
<ul>
<li><strong>AWS</strong> : IAM Roles, Policies, Service Control Policies</li>
<li><strong>GCP</strong> : IAM Roles, Organization Policies</li>
<li><strong>Azure</strong> : RBAC, Management Groups, Policy</li>
</ul>

<h2 id="network-policies">Network Policies</h2>
<pre><code># Kubernetes NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

  name: allow-frontend

  podSelector:
    matchLabels:
      app: backend

<h2 id="encryption">Chiffrement</h2>
<ul>
<li><strong>Au repos (at rest)</strong> : EBS, S3 SSE, RDS encryption</li>
<li><strong>En transit</strong> : TLS 1.3, mTLS, VPN</li>
<li><strong>En memoire</strong> : Confidential Computing (AWS Nitro, GCP Shielded)</li>
<li><strong>Gestion des cles</strong> : KMS, Cloud KMS, Key Vault</li>
</ul>

<h2 id="best-practices">Bonnes Pratiques</h2>
<ul>
<li><strong>Zero Trust</strong> : ne jamais faire confiance au reseau</li>
<li><strong>Defense en profondeur</strong> : multiples couches de securite</li>
<li><strong>Security by Design</strong> : securite des la conception</li>
<li><strong>Audit logging</strong> : CloudTrail, Audit Logs</li>
<li><strong>Vulnerability scanning</strong> : ECR scanning, Trivy</li>
<li><strong>Incident response</strong> : plan et procedures</li>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Comment securiser une architecture cloud ?</h4><p>1) IAM strict (moindre privilege). 2) Chiffrement partout. 3) Network segmentation. 4) Monitoring et alerting. 5) Patch management. 6) Security reviews regulieres. 7) Backup et disaster recovery. 8) Training des equipes.</p></div>
<div class="qa"><h4>Q2 : Que faire face a une compromission en production ?</h4><p>1) <strong>Containment</strong> : isoler le systeme compromise. 2) <strong>Eradication</strong> : supprimer l'acces malveillant. 3) <strong>Recovery</strong> : restaurer depuis backup propre. 4) <strong>Post-mortem</strong> : analyser et ameliorer. 5) <strong>Notification</strong> : informer les parties concernees. 6) <strong>Rotation</strong> : tous les credentials potentiellement exposes.</p></div>

function getProgress(){return JSON.parse(localStorage.getItem('devops_progress')||'{}')}
function setProgress(id,val){const p=getProgress();p[id]=val;localStorage.setItem('devops_progress',JSON.stringify(p))}

function getLesson(id){return LESSONS.find(l=>l.id===id)}
function getModuleForLesson(id){return MODULES.find(m=>m.lessons.includes(id))}
function getLessonIndex(id){return LESSONS.findIndex(l=>l.id===id)}

function renderSidebar(currentId){
  const progress=getProgress();
  const completed=Object.values(progress).filter(v=>v).length;
  const total=LESSONS.length;
  let html=`
  <div class="sidebar-box">
    <h4>Progression</h4>
    <div class="progress-bar"><div class="progress-fill" style="width:${(completed/total)*100}%"></div></div>
    <p class="progress-text">${completed}/${total} lecons completees</p>
  </div>`;
  
  MODULES.forEach(mod=>{
    const isOpen=getModuleForLesson(currentId)?.id===mod.id;
    html+=`<div class="sidebar-box">
      <h4 class="module-toggle ${isOpen?'':'collapsed'}" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed')">Module ${mod.id}: ${mod.name}</h4>
      <div class="module-lessons ${isOpen?'':'collapsed'}" style="max-height:${mod.lessons.length*40}px">`;
    mod.lessons.forEach(lid=>{
      const lesson=getLesson(lid);
      const isCurrent=lid===currentId;
      const isCompleted=progress[lid];
      html+=`<a class="lesson-link ${isCurrent?'active':''} ${isCompleted?'completed':''}" href="?id=${lid}">
        <span class="check">&#10003;</span> ${lid}. ${lesson.title}
      </a>`;
    });
    html+=`</div></div>`;
  });
  return html;
}

function renderNav(currentId){
  const idx=getLessonIndex(currentId);
  let html='';
  if(idx>0){
    const prev=LESSONS[idx-1];
    html+=`<a href="?id=${prev.id}"><span>&#8592; Lecon precedente</span>${prev.title}</a>`;
  }else{html+=`<div></div>`}
  if(idx<LESSONS.length-1){
    const next=LESSONS[idx+1];
    html+=`<a href="?id=${next.id}" style="text-align:right"><span>Lecon suivante &#8594;</span>${next.title}</a>`;
  }
  return html;
}

function init(){
  const params=new URLSearchParams(window.location.search);
  const id=parseInt(params.get('id'))||1;
  const lesson=getLesson(id);
  if(!lesson){document.getElementById('lesson-content').innerHTML='<p>Lecon non trouvee.</p>';return}
  const mod=getModuleForLesson(id);
  
  document.getElementById('breadcrumb').innerHTML=`<a href="/">Accueil</a> / <a href="pages/devops.html">DevOps</a> / Module ${mod.id} / ${lesson.title}`;
  document.getElementById('lesson-title').textContent=lesson.title;
  document.getElementById('lesson-meta').innerHTML=`
    <span class="meta-item">Module ${mod.id} : ${mod.name}</span>
    <span class="meta-item">Lecon ${id}/${LESSONS.length}</span>
    <span class="meta-item">${lesson.duration}</span>
    <span class="badge badge-${lesson.difficulty}">${lesson.difficulty.charAt(0).toUpperCase()+lesson.difficulty.slice(1)}</span>`;
  document.getElementById('lesson-content').innerHTML=lesson.content;
  document.getElementById('nav-lesson').innerHTML=renderNav(id);
  document.getElementById('sidebar').innerHTML=renderSidebar(id);
  
  setProgress(id,true);
  renderSidebar(id);
  
  const toc=document.querySelectorAll('.toc a');
  const sections=document.querySelectorAll('h2[id]');
  window.addEventListener('scroll',()=>{
    let current='';
    sections.forEach(s=>{if(window.scrollY>=s.offsetTop-100)current=s.id});
    toc.forEach(a=>{a.classList.toggle('active',a.getAttribute('href')==='#'+current)});
  });
}
init();
</script>
