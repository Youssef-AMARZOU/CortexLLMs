<div class="qa"><h4>Q2 : Comment evaluer la qualite d'un systeme RAG ?</h4><ul><li><strong>Retrieval precision</strong> : les chunks recuperes sont-ils pertinents ?</li><li><strong>Retrieval recall</strong> : tous les chunks pertinents sont-ils recuperes ?</li><li><strong>Answer relevancy</strong> : la reponse correspond-elle a la question ?</li><li><strong>Faithfulness</strong> : la reponse est-elle fidele aux sources ?</li></ul></div>
`},

{id:27,title:"Prompt Engineering",module:3,difficulty:"moyen",duration:"20 min",
content:`
<h2 id="definition">Prompt Engineering</h2>
<p>Le prompt engineering est l'art de formuler des instructions pour obtenir les meilleurs resultats d'un LLM.</p>

<h2 id="techniques">Techniques de base</h2>
<ul>
<li><strong>Zero-shot</strong> : demande directe sans exemples</li>
<li><strong>Few-shot</strong> : fournir des exemples de la reponse attendue</li>
<li><strong>Chain-of-thought</strong> : demander de raisoner etape par etape</li>
<li><strong>Role-playing</strong> : donner un role au LLM</li>
</ul>
<pre><code># Zero-shot
"Classe ce texte comme positif ou negatif: 'Ce film est excellent'"

# Few-shot
"Voici des exemples:
Texte: 'J'adore ce produit' -> Positif
Texte: 'C'est horrible' -> Negatif
Texte: 'Ce film est excellent' ->"

# Chain-of-thought
"Resous ce probleme etape par etape:
1. Identifie les donnees
2. Applique la formule
3. Calcule le resultat"</code></pre>

<h2 id="system-prompt">System Prompt</h2>
<pre><code>system_prompt = """
Tu es un expert en machine learning.
Tu donnes des reponses precises et techniques.
Tu cites toujours tes sources.
Tu utilises un ton professionnel mais accessible.
"""

response = client.chat.completions.create(
    model="gpt-4",
    messages=[
        {"role": "system", "content": system_prompt},
        {"role": "user", "content": "Explique le overfitting"}
    ]
)</code></pre>

<h2 id="techniques-avancees">Techniques avancees</h2>
<ul>
<li><strong>Self-consistency</strong> : generer plusieurs reponses, prendre la majorite</li>
<li><strong>Tree-of-thought</strong> : explorer plusieurs branches de raisonnement</li>
<li><strong>ReAct</strong> : alterner raisonnement et action</li>
</ul>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Few-shot vs Fine-tuning - quand utiliser chaque approche ?</h4><p>Le <strong>few-shot</strong> ne demande aucune donnee d'entrainement. Il convient aux taches simples et au prototypage rapide. Le <strong>fine-tuning</strong> donne la performance maximale sur des taches complexes, avec un cout d'execution faible. Commencez par le few-shot.</p></div>
<div class="qa"><h4>Q2 : Comment evaluer la qualite des prompts ?</h4><ul><li>Metriques specifiques (accuracy, F1).</li><li>Eval humain.</li><li>Tests unitaires pour prompts.</li><li>A/B testing.</li><li>Robustesse aux variations.</li><li>Cout vs performance.</li><li>Latence.</li></ul></div>
`},

{id:28,title:"Alignement IA",module:3,difficulty:"difficile",duration:"30 min",
content:`
<h2 id="definition">Alignement des LLMs</h2>
<p>L'alignement consiste a s'assurer que les LLMs produisent des reponses utiles, inoffensives et fideles aux intentions humaines.</p>

<h2 id="rlhf">RLHF (Reinforcement Learning from Human Feedback)</h2>
<p>RLHF entraine le LLM a maximiser les preferences humaines :</p>
<ol>
<li><strong>SFT</strong> : fine-tuning supervise sur des examples de qualite</li>
<li><strong>Reward Model</strong> : entrainer un modele a predire les preferences humaines</li>
<li><strong>PPO</strong> : optimiser le LLM avec le reward model</li>
</ol>
<pre><code>from trl import PPOTrainer, PPOConfig

config = PPOConfig(
    learning_rate=1.41e-5,
    batch_size=64,
    mini_batch_size=16
)

ppo_trainer = PPOTrainer(
    config=config,
    model=model,
    ref_model=ref_model,
    tokenizer=tokenizer
)</code></pre>

<h2 id="dpo">DPO (Direct Preference Optimization)</h2>
<p>DPO simplifie RLHF en eliminant le reward model :</p>
<pre><code>from trl import DPOTrainer, DPOConfig

dpo_config = DPOConfig(
    learning_rate=1e-5,
    beta=0.1,
    loss_type="sigmoid"
)

dpo_trainer = DPOTrainer(
    model=model,
    ref_model=ref_model,
    tokenizer=tokenizer,
    train_dataset=preference_dataset
)</code></pre>

<h2 id="safety">Securite et Controle</h2>
<ul>
<li><strong>Constitutional AI</strong> : le modele suit des principes constitutionnels</li>
<li><strong>Red teaming</strong> : tester les failles de securite</li>
<li><strong>Guardrails</strong> : filtres d'entree/sortie</li>
<li><strong>Content filtering</strong> : detection de contenu dangereux</li>
</ul>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : RLHF vs DPO - lequel preferer ?</h4><p><strong>DPO</strong> est plus simple : pas de reward model, plus de stabilite et moins de cout. <strong>RLHF</strong> est plus flexible et convient mieux aux taches complexes. DPO est le choix recommande par defaut. RLHF reste utile pour les cas specialises.</p></div>
<div class="qa"><h4>Q2 : Comment evaluer l'alignement d'un LLM ?</h4><ul><li><strong>Helpfulness</strong> : les reponses sont-elles utiles ?</li><li><strong>Harmlessness</strong> : les reponses sont-elles sure ?</li><li><strong>Honesty</strong> : les reponses sont-elles fideles ?</li><li>Benchmarks (MT-Bench, AlpacaEval).</li><li>Eval humain.</li><li>Red teaming.</li></ul></div>
`},

{id:29,title:"Evaluation des LLMs",module:3,difficulty:"moyen",duration:"25 min",
content:`
<h2 id="benchmarks">Benchmarks standardises</h2>
<ul>
<li><strong>MMLU</strong> : connaissance generale multi-matiere</li>
<li><strong>HumanEval</strong> : generation de code</li>
<li><strong>TruthfulQA</strong> : fidelite aux faits</li>
<li><strong>MT-Bench</strong> : conversation multi-tours</li>
<li><strong>GSM8K</strong> : raisonnement mathematique</li>
</ul>

<h2 id="eval-metrics">Metriques d'evaluation</h2>
<pre><code># Perplexite (plus bas = mieux)
import torch

def perplexity(model, tokenizer, text):
    inputs = tokenizer(text, return_tensors="pt")
    with torch.no_grad():
        outputs = model(**inputs, labels=inputs["input_ids"])
    return torch.exp(outputs.loss).item()

# BLEU score (traduction)
from nltk.translate.bleu_score import corpus_bleu
references = [["le chat est sur le tapis".split()]]
hypotheses = ["the cat is on the mat".split()]
bleu = corpus_bleu(references, hypotheses)

# ROUGE score (resumé)
from rouge_score import rouge_scorer
scorer = rouge_scorer.RougeScorer(['rouge1', 'rouge2', 'rougeL'])
scores = scorer.score(reference, generated)</code></pre>

<h2 id="eval-humaine">Evaluation Humaine</h2>
<p>L'evaluation humaine reste le gold standard :</p>
<ul>
<li><strong>Pairwise comparison</strong> : comparer deux reponses cote a cote</li>
<li><strong>Rating</strong> : noter sur une echelle (1-5 ou 1-7)</li>
<li><strong>Checklist</strong> : verifier des criteres specifiques</li>
</ul>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Perplexite vs BLEU - que mesurent-ils ?</h4><p>La <strong>perplexite</strong> mesure la qualite probabiliste d'un modele de langage. <strong>BLEU</strong> mesure la similarite avec des references humaines, typiquement en traduction. La perplexite est une metrique intrinseque. BLEU est extrinseque. Pour les LLM, on utilise aussi des benchmarks specifiques comme MMLU ou HumanEval.</p></div>
<div class="qa"><h4>Q2 : Comment evaluer un LLM sur des cas limites ?</h4><ul><li>Red teaming systematique.</li><li>Tests de securite.</li><li>Biais de genre/race.</li><li>Hallucinations.</li><li>Raisonnement logique.</li><li>Connaissance de niche.</li><li>Resistance aux attaques (jailbreaks).</li></ul></div>
`},

<h2 id="inference">Inference et Serving</h2>
<pre><code># vLLM - inference rapide
from vllm import LLM, SamplingParams

<h2 id="quantization">Quantization</h2>
<p>La quantization reduit la precision des poids pour inferer plus vite et avec moins de memoire :</p>
<pre><code>from transformers import BitsAndBytesConfig

# 4-bit quantization
bnb_config = BitsAndBytesConfig(
    load_in_4bit=True,
    bnb_4bit_quant_type="nf4",
    bnb_4bit_compute_dtype=torch.bfloat16
)

    "meta-llama/Llama-2-7b-hf",
    quantization_config=bnb_config
)</code></pre>

<h2 id="serving">Architecture de Serving</h2>
<ul>
<li><strong>Batching dynamique</strong> : grouper les requetes simultanees</li>
<li><strong>Streaming</strong> : streaming des tokens en temps reel</li>
<li><strong>Caching</strong> : KV-cache pour les generations longues</li>
<li><strong>Load balancing</strong> : repartition entre plusieurs GPUs</li>
</ul>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : vLLM vs TGI - lequel utiliser ?</h4><p><strong>vLLM</strong> : PagedAttention, batching continu, tres rapide. <strong>TGI</strong> : Docker-ready, HuggingFace ecosystem, bon pour les deploiements simples. vLLM est generalement plus performant. TGI est plus simple a deployer.</p></div>
<div class="qa"><h4>Q2 : Comment reduire le cout d'inference des LLMs ?</h4><ul><li>Quantization (INT8, INT4).</li><li>Model distillation.</li><li>Pruning.</li><li>Batch optimization.</li><li>Caching.</li><li>GPU inferieurs pour les petits modèles.</li><li>Selection du modele selon la difficulte de la tache.</li></ul></div>

<h2 id="definition">Agents IA</h2>
<p>Les agents IA sont des systemes autonomes qui utilisent des LLMs pour planifier, raisonner et agir sur leur environnement.</p>
<div class="callout"><strong>Composants :</strong> LLM (cerveau), Memoire (contexte), Outils (actions), Planification (strategie).</div>

<h2 id="langchain">Agents avec LangChain</h2>
<pre><code>from langchain.agents import initialize_agent, Tool
from langchain.llms import OpenAI

def search_tool(query):
    # Logique de recherche
    return results

tools = [
    Tool(name="Search", func=search_tool, description="Rechercher sur le web"),
    Tool(name="Calculator", func=calculate, description="Calculer des expressions")
]

llm = OpenAI(temperature=0)
agent = initialize_agent(tools, llm, agent="zero-shot-react-description")
response = agent.run("Quel est le PIB de la France ?")</code></pre>

<h2 id="planification">Planification</h2>
<pre><code># Chain-of-Thought pour la planification
system_prompt = """
Tu es un assistant intelligent. Pour chaque tache:
1. Analyse le probleme
2. Decompose en sous-taches
3. Execute chaque sous-tache
4. Verifie le resultat
5. Ajuste si necessaire
"""

# ReAct (Reasoning + Acting)
prompt = """
Question: {question}
Thought: je dois d'abord...
Action: search
Action Input: {query}
Observation: {result}
Thought: maintenant je peux...
Final Answer: {answer}
"""</code></pre>

<h2 id="memoire">Memoire et Contexte</h2>
<pre><code>from langchain.memory import ConversationBufferMemory, ConversationSummaryMemory

# Buffer memoire

# Summary memoire (pour les longues conversations)

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : ReAct vs Plan-and-Execute - lequel preferer ?</h4><p><strong>ReAct</strong> est simple et iteratif, et convient aux taches simples. <strong>Plan-and-Execute</strong> planifie d'abord puis execute, ce qui convient aux taches complexes. En pratique, combinez les deux : planifiez grossierment, puis executez avec ReAct.</p></div>
<div class="qa"><h4>Q2 : Comment evaluer un agent IA ?</h4><ul><li><strong>Taux de reussite</strong> : completion de la tache.</li><li><strong>Nombre d'etapes</strong> : efficacite.</li><li><strong>Cout</strong> : tokens utilises.</li><li><strong>Latence</strong> : temps de reponse.</li><li><strong>Robustesse</strong> : gestion des erreurs.</li><li><strong>Securite</strong> : pas d'actions dangereuses.</li></ul></div>
`},

{id:32,title:"Ethique et Securite IA",module:3,difficulty:"moyen",duration:"25 min",
content:`
<h2 id="biais-ia">Biais dans les Systemes IA</h2>
<p>Les modeles IA peuvent perpetuer ou amplifier les biais existants dans les donnees d'entrainement.</p>
<ul>
<li><strong>Biais de donnees</strong> : sous-representation de certains groupes</li>
<li><strong>Biais d'algorithme</strong> : optimisation injuste</li>
<li><strong>Biais d'utilisation</strong> : deployment dans des contextes inappropries</li>
</ul>
<div class="callout"><strong>Exemple :</strong> Un modele de recrutement entraine sur des historiques peut discriminer les femmes si les dernieres promotions ont ete majoritairement masculines.</div>

<h2 id="fairness">Fairness et Equite</h2>
<pre><code>from aif360.datasets import BinaryLabelDataset
from aif360.metrics import BinaryLabelDatasetMetric

# Mesurer les biais
dataset = BinaryLabelDataset(df=df, label_names=['outcome'],
                            protected_attribute_names=['gender'])
metric = BinaryLabelDatasetMetric(
    dataset,
    privileged_groups=[{'gender': 1}],
    unprivileged_groups=[{'gender': 0}]
)

print(f"Disparate Impact: {metric.disparate_impact():.3f}")
print(f"Statistical Parity Diff: {metric.statistical_parity_difference():.3f}")</code></pre>

<h2 id="securite">Securite des LLMs</h2>
<ul>
<li><strong>Prompt injection</strong> : attaques par manipulation de prompts</li>
<li><strong>Data poisoning</strong> : corruption des donnees d'entrainement</li>
<li><strong>Jailbreaking</strong> : contourner les restrictions de securite</li>
<li><strong>Extraction de donnees</strong> : recuperer des informations privees</li>
</ul>

<h2 id="regulation">Regulation et Gouvernance</h2>
<ul>
<li><strong>EU AI Act</strong> : classification des risques IA en Europe</li>
<li><strong>RGPD</strong> : protection des donnees personnelles</li>
<li><strong>Explainability</strong> : droit a l'explication des decisions IA</li>
<li><strong>Audit</strong> : verification periodique des modeles</li>
</ul>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Comment detecter et mitiger les biais dans un modele ?</h4><ul><li>Analyser les donnees (representation par groupe).</li><li>Metriques de fairness (demographic parity, equalized odds).</li><li>Pre-processing (re-echantillonnage).</li><li>In-processing (constraints d'equite).</li><li>Post-processing (ajustement des seuils).</li><li>Monitoring continu.</li></ul></div>
<div class="qa"><h4>Q2 : Comment securiser un LLM en production ?</h4><ul><li>Input validation (filtrage des prompts).</li><li>Output filtering (contenu dangereux).</li><li>Rate limiting.</li><li>Monitoring des patterns d'attaque.</li><li>Red teaming regulier.</li><li>Patching des vulnerabilites.</li><li>Documentation des risques.</li></ul></div>
`}
];

function getProgress(){return JSON.parse(localStorage.getItem('ai_progress')||'{}')}
function setProgress(id,val){const p=getProgress();p[id]=val;localStorage.setItem('ai_progress',JSON.stringify(p))}

function getLesson(id){return LESSONS.find(l=>l.id===id)}
function getModuleForLesson(id){return MODULES.find(m=>m.lessons.includes(id))}
function getLessonIndex(id){return LESSONS.findIndex(l=>l.id===id)}

function renderSidebar(currentId){
  const progress=getProgress();
  const completed=Object.values(progress).filter(v=>v).length;
  const total=LESSONS.length;
  let html=`
  <div class="sidebar-box">
    <h4>Progression</h4>
    <div class="progress-bar"><div class="progress-fill" style="width:${(completed/total)*100}%"></div></div>
    <p class="progress-text">${completed}/${total} lecons completees</p>
  </div>`;
  
  MODULES.forEach(mod=>{
    const isOpen=getModuleForLesson(currentId)?.id===mod.id;
    html+=`<div class="sidebar-box">
      <h4 class="module-toggle ${isOpen?'':'collapsed'}" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed')">Module ${mod.id}: ${mod.name}</h4>
      <div class="module-lessons ${isOpen?'':'collapsed'}" style="max-height:${mod.lessons.length*40}px">`;
    mod.lessons.forEach(lid=>{
      const lesson=getLesson(lid);
      const isCurrent=lid===currentId;
      const isCompleted=progress[lid];
      html+=`<a class="lesson-link ${isCurrent?'active':''} ${isCompleted?'completed':''}" href="?id=${lid}">
        <span class="check">&#10003;</span> ${lid}. ${lesson.title}
      </a>`;
    });
    html+=`</div></div>`;
  });
  return html;
}

function renderNav(currentId){
  const idx=getLessonIndex(currentId);
  let html='';
  if(idx>0){
    const prev=LESSONS[idx-1];
    html+=`<a href="?id=${prev.id}"><span>&#8592; Lecon precedente</span>${prev.title}</a>`;
  }else{html+=`<div></div>`}
  if(idx<LESSONS.length-1){
    const next=LESSONS[idx+1];
    html+=`<a href="?id=${next.id}" style="text-align:right"><span>Lecon suivante &#8594;</span>${next.title}</a>`;
  }
  return html;
}

function init(){
  const params=new URLSearchParams(window.location.search);
  const id=parseInt(params.get('id'))||1;
  const lesson=getLesson(id);
  if(!lesson){document.getElementById('lesson-content').innerHTML='<p>Lecon non trouvee.</p>';return}
  const mod=getModuleForLesson(id);
  
  document.getElementById('breadcrumb').innerHTML=`<a href="../index.html">Accueil</a> / <a href="ai-engineering.html">Ingenierie IA</a> / Module ${mod.id} / ${lesson.title}`;
  document.getElementById('lesson-title').textContent=lesson.title;
  document.getElementById('lesson-meta').innerHTML=`
    <span class="meta-item">Module ${mod.id} : ${mod.name}</span>
    <span class="meta-item">Lecon ${id}/${LESSONS.length}</span>
    <span class="meta-item">${lesson.duration}</span>
    <span class="badge badge-${lesson.difficulty}">${lesson.difficulty.charAt(0).toUpperCase()+lesson.difficulty.slice(1)}</span>`;
  document.getElementById('lesson-content').innerHTML=lesson.content;
  document.getElementById('nav-lesson').innerHTML=renderNav(id);
  document.getElementById('sidebar').innerHTML=renderSidebar(id);
  
  setProgress(id,true);
  renderSidebar(id);
  
  const toc=document.querySelectorAll('.toc a');
  const sections=document.querySelectorAll('h2[id]');
  window.addEventListener('scroll',()=>{
    let current='';
    sections.forEach(s=>{if(window.scrollY>=s.offsetTop-100)current=s.id});
    toc.forEach(a=>{a.classList.toggle('active',a.getAttribute('href')==='#'+current)});
  });
}
init();
</script>
