{id:1,title:"Load Balancing",module:1,difficulty:"moyen",duration:"25 min",
content:`
<h2 id="definition">Qu'est-ce que le Load Balancing ?</h2>
<p>Le load balancing distribue le trafic entrant sur plusieurs serveurs pour eviter la surcharge d'un seul et assurer la disponibilite. C'est un composant fondamental de toute architecture scalable.</p>
<div class="callout"><strong>Objectif :</strong> Aucun serveur ne doit etre submerge, et les utilisateurs doivent toujours recevoir une reponse, meme si un serveur tombe.</div>

<h2 id="algorithms">Algorithmes de Distribution</h2>
<h3>Round Robin</h3>
<p>Distribue les requetes cycliquement : serveur 1, 2, 3, 1, 2, 3... Simple mais ne tient pas compte de la charge.</p>

<h3>Weighted Round Robin</h3>
<p>Chaque serveur a un poids. Un serveur avec poids 3 recoit 3 fois plus de trafic qu'un serveur avec poids 1.</p>

<h3>Least Connections</h3>
<p>Envoie la requete au serveur avec le moins de connexions actives. Ideal quand les requetes ont des durees variable.</p>

<h3>IP Hash</h3>
<p>Hash l'adresse IP du client pour determiner le serveur. Assure la stickite (meme client -> meme serveur).</p>

<h2 id="l4-l7">Load Balancer L4 vs L7</h2>
<table style="width:100%;border-collapse:collapse;margin:16px 0">
<tr style="border-bottom:1px solid var(--bdr)"><th style="text-align:left;padding:8px;color:var(--wh)">Critere</th><th style="text-align:left;padding:8px;color:var(--wh)">L4 (Transport)</th><th style="text-align:left;padding:8px;color:var(--wh)">L7 (Application)</th></tr>
<tr style="border-bottom:1px solid var(--bdr)"><td style="padding:8px;color:var(--t2)">Couche</td><td style="padding:8px;color:var(--t2)">TCP/UDP</td><td style="padding:8px;color:var(--t2)">HTTP/HTTPS</td></tr>
<tr style="border-bottom:1px solid var(--bdr)"><td style="padding:8px;color:var(--t2)">Performance</td><td style="padding:8px;color:var(--t2)">Plus rapide</td><td style="padding:8px;color:var(--t2)">Plus lent (inspection)</td></tr>
<tr style="border-bottom:1px solid var(--bdr)"><td style="padding:8px;color:var(--t2)">Fonctionnalites</td><td style="padding:8px;color:var(--t2)">Distribution basique</td><td style="padding:8px;color:var(--t2)">Routing, SSL, WAF</td></tr>
<tr><td style="padding:8px;color:var(--t2)">Exemples</td><td style="padding:8px;color:var(--t2)">NLB, HAProxy TCP</td><td style="padding:8px;color:var(--t2)">ALB, Nginx, Envoy</td></tr>
</table>

<h2 id="health-checks">Health Checks</h2>
<p>Les health checks detectent les serveurs défaillants et les retirent temporairement du pool :</p>
<pre><code># Configuration health check - AWS ALB
health_check {
  path                = "/health"
  port                = "traffic-port"
  healthy_threshold   = 3
  unhealthy_threshold = 3
  timeout             = 5
  interval            = 30
  matcher             = "200"
}</code></pre>
<ul>
<li><strong>Active checks</strong> : le LB envoie des requetes periodiques</li>
<li><strong>Passive checks</strong> : detection via les echecs de connexions</li>
<li><strong>Deep health check</strong> : verification complete (DB, dependencies)</li>
</ul>

<h2 id="sticky-sessions">Sticky Sessions</h2>
<p>La stickite garde un client sur le meme serveur pendant sa session :</p>
<pre><code># Nginx - IP Hash pour stickite
upstream backend {
    ip_hash;
    server 10.0.0.1:8080;
    server 10.0.0.2:8080;
}

# Cookies pour stickite
upstream backend {
    server 10.0.0.1:8080;
    server 10.0.0.2:8080;
    sticky cookie srv_id expires=1h domain=.example.com path=/;
}</code></pre>
<div class="callout warning"><strong>Attention :</strong> Les sticky sessions empechent le load balancing uniforme et compliquent le scaling. Preferez le stateless avec Redis/Memcached pour les sessions.</div>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Comment choisir entre L4 et L7 ?</h4><p><strong>L4</strong> : quand vous avez besoin de performance brute (TCP, gaming, streaming). <strong>L7</strong> : quand vous avez besoin de routing intelligent (URL-based, header-based, SSL termination). La plupart des apps web utilisent L7.</p></div>
<div class="qa"><h4>Q2 : Que faire si le load balancer devient un point de panne ?</h4><p>1) Deployer en mode actif-passif (failover automatique). 2) DNS round robin avec plusieurs LB. 3) Anycast IP. 4) Load balancer distribue (Consul, Envoy). 5) Cloud provider managed LB (haute disponibilite).</p></div>
<div class="qa"><h4>Q3 : Comment gerer les connexions WebSocket avec un LB ?</h4><p>1) Sticky sessions (IP hash ou cookie). 2) Health checks sur le port WebSocket. 3) Idle timeout long (300s+). 4) Connection draining. 5) L4 load balancer pour maintenir la connexion TCP.</p></div>
`},

{id:2,title:"Caching",module:1,difficulty:"moyen",duration:"25 min",
content:`
<h2 id="definition">Strategies de Caching</h2>
<p>Le caching stocke les donnees frequemment accessee dans un stockage rapide pour reduire la latence et la charge sur les bases de donnees.</p>
<div class="formula">Latence : DB (10-100ms) > Redis (1-5ms) > Memoire (< 1ms)</div>

<h2 id="cdn">CDN (Content Delivery Network)</h2>
<p>Un CDN cache le contenu statique (images, CSS, JS) sur des serveurs distribues geometriquement :</p>
<ul>
<li><strong>Edge locations</strong> : points de presence proches des utilisateurs</li>
<li><strong>Cache hit</strong> : contenu trouve dans le cache (reponse rapide)</li>
<li><strong>Cache miss</strong> : contenu absent, fetch depuis l'origine</li>
<li><strong>TTL</strong> : duree de vie du cache (ex: 1 heure)</li>
</ul>

<h2 id="redis">Redis</h2>
<p>Redis est un magasin de cle-valeur en memoire avec persistence :</p>
<pre><code># Redis - operations courantes
SET user:123 '{"name":"Jean","email":"jean@example.com"}' EX 3600
GET user:123

# Cache-aside pattern
def get_user(user_id):
    # 1. Chercher dans le cache
    cached = redis.get(f"user:{user_id}")
    if cached:
        return json.loads(cached)
    
    # 2. Cache miss - chercher en DB
    user = db.query("SELECT * FROM users WHERE id = %s", user_id)
    
    # 3. Mettre en cache avec TTL
    redis.setex(f"user:{user_id}", 3600, json.dumps(user))
    return user</code></pre>

<h2 id="memcached">Memcached</h2>
<p>Memcached est plus simple que Redis, ideal pour le caching pur :</p>
<pre><code># Memcached - simple cle-valeur
memcached.set("key", "value", expire=300)
value = memcached.get("key")</code></pre>
<p><strong>Redis vs Memcached</strong> : Redis supporte les structures de donnees complexes (listes, sets, sorted sets), la persistence, et les transactions. Memcached est plus simple et leger.</p>

<h2 id="invalidation">Cache Invalidation</h2>
<p>"There are only two hard things in Computer Science: cache invalidation and naming things."</p>
<ul>
<li><strong>TTL-based</strong> : expiration automatique apres un delai</li>
<li><strong>Event-driven</strong> : invalidation sur mise a jour de donnees</li>
<li><strong>Versioned keys</strong> : <code>user:123:v2</code></li>
<li><strong>Write-through</strong> : ecriture dans le cache ET la DB</li>
<li><strong>Write-behind</strong> : ecriture dans le cache, asynchrone vers la DB</li>
</ul>

<h2 id="patterns">Patterns de Caching</h2>
<pre><code># Cache-Aside (Lazy Loading)
1. Application cherche dans le cache
2. Si miss, lit la DB
3. Met en cache pour la prochaine fois

# Read-Through
1. Application lit depuis le cache
2. Le cache load automatiquement depuis la DB si miss

# Write-Through
1. Application ecrit dans le cache
2. Le cache ecrit dans la DB de maniere synchrone

# Write-Behind (Write-Back)
1. Application ecrit dans le cache
2. Le cache ecrit dans la DB de maniere asynchrone</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Comment eviter le cache stampede (thundering herd) ?</h4><p>Quand le cache expire et 1000 requetes frappent la DB en meme temps. Solutions : 1) Lock mutex (seul un process charge le cache). 2) Pre-warming. 3) Refresh-ahead cache. 4) Jitter sur le TTL. 5) Probabilistic early expiration.</p></div>
<div class="qa"><h4>Q2 : Cache-aside vs Read-through ?</h4><p><strong>Cache-aside</strong> : l'application gere le cache (plus de controle, plus de code). <strong>Read-through</strong> : le cache gere le loading (plus simple). Cache-aside est plus flexible et plus courant.</p></div>
<div class="qa"><h4>Q3 : Comment gerer la coherence du cache ?</h4><p>1) TTL court pour les donnees critiques. 2) Event-driven invalidation (CDC). 3) Cache versioning. 4) Eventual consistency acceptable pour beaucoup de cas. 5) Strong consistency : write-through (plus lent).</p></div>
`},

{id:3,title:"Message Queues",module:1,difficulty:"moyen",duration:"25 min",
content:`
<h2 id="definition">Files de Messages</h2>
<p>Les queues de messages permettent la communication asynchrone entre services, decouplant l'emetteur du recepteur.</p>
<div class="callout"><strong>Avantages :</strong> Decouplage, absorption des pics de charge, fiabilite (pas de perte de messages), scalabilite.</div>

<h2 id="kafka">Apache Kafka</h2>
<p>Kafka est un systeme de streaming distribue a haut debit :</p>
<pre><code>// Producer Kafka
const producer = kafka.producer();
await producer.send({
  topic: 'user-events',
  messages: [
    { key: 'user-123', value: JSON.stringify({ event: 'login', timestamp: Date.now() }) }
  ]
});

// Consumer Kafka
const consumer = kafka.consumer({ groupId: 'my-app' });
await consumer.subscribe({ topic: 'user-events', fromBeginning: true });
await consumer.run({
  eachMessage: async ({ message }) => {
    const event = JSON.parse(message.value.toString());
    console.log('Event recu:', event);
  }
});</code></pre>
<p>Concepts Kafka :</p>
<ul>
<li><strong>Topics</strong> : categories de messages</li>
<li><strong>Partitions</strong> : parallelisme au sein d'un topic</li>
<li><strong>Consumer Groups</strong> : groupes de consommateurs paralleles</li>
<li><strong>Offset</strong> : position dans la partition (replay possible)</li>
</ul>

<h2 id="rabbitmq">RabbitMQ</h2>
<p>RabbitMQ est un broker de messages traditionnel (AMQP) :</p>
<pre><code># Producer
channel.sendToQueue('task_queue', Buffer.from('Nouvelle tache'), {
  persistent: true  // Survit aux restarts
});

# Consumer avec ack
channel.consume('task_queue', (msg) => {
  console.log('Recu:', msg.content.toString());
  channel.ack(msg);  // Confirmer le traitement
});</code></pre>

<h2 id="sqs">AWS SQS</h2>
<p>SQS est un service managed sans infrastructure :</p>
<ul>
<li><strong>Standard Queue</strong> : at-least-once delivery, ordre non garanti</li>
<li><strong>FIFO Queue</strong> : exactly-once, ordre garanti</li>
<li><strong>Dead Letter Queue</strong> : messages en echec</li>
</ul>

<h2 id="pubsub">Pub/Sub vs Point-to-Point</h2>
<ul>
<li><strong>Point-to-Point (Queue)</strong> : un message, un consommateur</li>
<li><strong>Pub/Sub (Topic)</strong> : un message, plusieurs abonnes</li>
</ul>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Kafka vs RabbitMQ ?</h4><p><strong>Kafka</strong> : streaming, haut debit, replay, log durable. <strong>RabbitMQ</strong> : routing complexe, messages courts, at-most-once. Kafka est mieux pour le data pipeline, RabbitMQ pour les taches asynchrones.</p></div>
<div class="qa"><h4>Q2 : Comment gerer les messages en echec ?</h4><p>1) Dead Letter Queue (DLQ) pour les messages rejetes. 2) Retry avec backoff exponentiel. 3) Circuit breaker pour eviter les cascades. 4) Alerting sur les DLQ. 5) Analyse et reprocessing manuel.</p></div>
<div class="qa"><h4>Q3 : Comment garantir l'ordre des messages ?</h4><p>1) Partition par cle (user_id) dans Kafka. 2) FIFO queue dans SQS. 3) Routing key dans RabbitMQ. Attention : l'ordre est garanti par partition/clef, pas globalement.</p></div>
`},

{id:4,title:"SQL vs NoSQL",module:1,difficulty:"moyen",duration:"25 min",
content:`
<h2 id="acid">ACID (SQL)</h2>
<p>Les bases relationnelles garantissent les proprietes ACID :</p>
<ul>
<li><strong>Atomicite</strong> : toutes les operations reussissent ou aucune</li>
<li><strong>Coherence</strong> : les regles de validation sont toujours respectees</li>
<li><strong>Isolation</strong> : les transactions concurrentes n'interferent pas</li>
<li><strong>Durabilite</strong> : les donnees validees sont permanentes</li>
</ul>

<h2 id="cap">Theoreme CAP</h2>
<div class="formula">On ne peut avoir que 2 sur 3 : Coherence, Disponibilite, Tolerance aux partitions</div>
<ul>
<li><strong>CP</strong> : Coherence + Partition tolerance (MongoDB, HBase)</li>
<li><strong>AP</strong> : Disponibilite + Partition tolerance (Cassandra, DynamoDB)</li>
<li><strong>CA</strong> : Coherence + Disponibilite (pas de partitions, rare en pratique)</li>
</ul>

<h2 id="sharding">Sharding et Replication</h2>
<p><strong>Sharding</strong> : partitionnement horizontal des donnees sur plusieurs noeuds.</p>
<pre><code># Sharding par hash
shard = hash(user_id) % number_of_shards
# user_id 123 -> shard 2
# user_id 456 -> shard 0</code></pre>
<p><strong>Replication</strong> : copie des donnees sur plusieurs noeuds pour la haute disponibilite.</p>

<h2 id="choosing">Choisir la Bonne DB</h2>
<table style="width:100%;border-collapse:collapse;margin:16px 0">
<tr style="border-bottom:1px solid var(--bdr)"><th style="text-align:left;padding:8px;color:var(--wh)">Critere</th><th style="text-align:left;padding:8px;color:var(--wh)">SQL</th><th style="text-align:left;padding:8px;color:var(--wh)">NoSQL</th></tr>
<tr style="border-bottom:1px solid var(--bdr)"><td style="padding:8px;color:var(--t2)">Schema</td><td style="padding:8px;color:var(--t2)">Fixe (rigide)</td><td style="padding:8px;color:var(--t2)">Flexible</td></tr>
<tr style="border-bottom:1px solid var(--bdr)"><td style="padding:8px;color:var(--t2)">Transactions</td><td style="padding:8px;color:var(--t2)">ACID complets</td><td style="padding:8px;color:var(--t2)">Limites</td></tr>
<tr style="border-bottom:1px solid var(--bdr)"><td style="padding:8px;color:var(--t2)">Scaling</td><td style="padding:8px;color:var(--t2)">Vertical</td><td style="padding:8px;color:var(--t2)">Horizontal</td></tr>
<tr><td style="padding:8px;color:var(--t2)">Requetes</td><td style="padding:8px;color:var(--t2)">SQL, JOINs</td><td style="padding:8px;color:var(--t2)">Pas de JOINs</td></tr>
</table>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Quand utiliser NoSQL ?</h4><p>1) Schema flexible (donnees semi-structurees). 2) Scalabilite horizontale necesaire. 3) Haute disponibilite critique. 4) Donnees de type key-value ou document. 5) Pas besoin de transactions complexes. 6) Volume de donnees massif.</p></div>
<div class="qa"><h4>Q2 : Comment faire des JOINs dans NoSQL ?</h4><p>1) Denormalisation (duplicer les donnees). 2) Embedding (inserer les documents lies). 3) References avec requetes cote applicatif. 4) MongoDB $lookup (JOIN left). 5) Redis : pre-calculer les relations. Les JOINs sont un trade-off : performance vs integrite.</p></div>
`},

{id:5,title:"API Design",module:1,difficulty:"moyen",duration:"25 min",
content:`
<h2 id="rest">REST API</h2>
<p>REST (Representational State Transfer) utilise les verbes HTTP pour les operations CRUD :</p>
<pre><code># Endpoints REST
GET    /api/users          # Lister les utilisateurs
GET    /api/users/123      # Recuperer un utilisateur
POST   /api/users          # Creer un utilisateur
PUT    /api/users/123      # Modifier completement
PATCH  /api/users/123      # Modifier partiellement
DELETE /api/users/123      # Supprimer</code></pre>
<p>Principes REST :</p>
<ul>
<li><strong>Stateless</strong> : chaque requete contient toute l'info necessaire</li>
<li><strong>Uniform Interface</strong> : convention d'URL et verbes</li>
<li><strong>Cacheable</strong> : reponses cacheables</li>
<li><strong>Layered System</strong> : architecture en couches</li>
</ul>

<h2 id="graphql">GraphQL</h2>
<p>GraphQL permet au client de demander exactement les donnees dont elle a besoin :</p>
<pre><code># Requete GraphQL
query {
  user(id: 123) {
    name
    email
    posts(limit: 5) {
      title
      comments {
        body
      }
    }
  }
}

# Schema
type User {
  id: ID!
  name: String!
  email: String!
  posts: [Post!]!
}

type Post {
  id: ID!
  title: String!
  body: String!
  comments: [Comment!]!
}</code></pre>

<h2 id="grpc">gRPC</h2>
<p>gRPC utilise Protocol Buffers pour la serialisation et HTTP/2 pour le transport :</p>
<pre><code>// service.proto
service UserService {
  rpc GetUser (GetUserRequest) returns (User);
  rpc ListUsers (ListUsersRequest) returns (stream User);
}

message User {
  int32 id = 1;
  string name = 2;
  string email = 3;
}</code></pre>
<p><strong>gRPC vs REST</strong> : gRPC est plus rapide (binaire), supporte le streaming, mais moins lisible. REST est plus simple et universel.</p>

<h2 id="versioning">Versioning</h2>
<pre><code># Versioning par URL
/api/v1/users
/api/v2/users

# Versioning par header
Accept: application/vnd.myapp.v2+json

# Versioning par query param
/api/users?version=2</code></pre>

<h2 id="rate-limiting">Rate Limiting</h2>
<pre><code># Headers de rate limiting
X-RateLimit-Limit: 1000
X-RateLimit-Remaining: 999
X-RateLimit-Reset: 1609459200

# Algorithmes
# Token Bucket : tokens restants, regeneration periodique
# Sliding Window : requetes dans les N dernieres secondes
# Fixed Window : compteur par fenetre temporelle</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : REST vs GraphQL vs gRPC ?</h4><p><strong>REST</strong> : standard, simple, cache HTTP. <strong>GraphQL</strong> : flexibilite client, pas de over-fetching, complexe a cacher. <strong>gRPC</strong> : haute performance, streaming, service-to-service. Choisissez selon le cas d'usage.</p></div>
<div class="qa"><h4>Q2 : Comment concevoir une API RESTful bien ?</h4><p>1) Noms de ressources au pluriel. 2) Verbes HTTP appropries. 3) Codes de reponse corrects. 4) Pagination. 5) Versioning. 6) Rate limiting. 7) Documentation (OpenAPI). 8) HATEOAS (liens d'hypermedia).</p></div>
`},

{id:6,title:"DNS",module:1,difficulty:"facile",duration:"15 min",
content:`
<h2 id="resolution">Resolution DNS</h2>
<p>Le DNS traduit les noms de domaine en adresses IP :</p>
<ol>
<li><strong>Browser cache</strong> : le navigateur stocke les resultats recents</li>
<li><strong>OS cache</strong> : le fichier hosts et le resolver local</li>
<li><strong>Recursive resolver</strong> : le DNS de votre ISP (ou 8.8.8.8)</li>
<li><strong>Root nameservers</strong> : .com, .org, etc.</li>
<li><strong>TLD nameservers</strong> : gestionnaires du domaine</li>
<li><strong>Authoritative nameservers</strong> : le DNS final du domaine</li>
</ol>

<h2 id="records">Types d'enregistrements</h2>
<ul>
<li><strong>A</strong> : nom -> IPv4 (ex: example.com -> 93.184.216.34)</li>
<li><strong>AAAA</strong> : nom -> IPv6</li>
<li><strong>CNAME</strong> : alias -> autre nom (www -> example.com)</li>
<li><strong>MX</strong> : serveur mail (priorite: 10 mail.example.com)</li>
<li><strong>TXT</strong> : texte (SPF, DKIM, verification)</li>
<li><strong>NS</strong> : serveur de noms</li>
<li><strong>SOA</strong> : Start of Authority (metadata du domaine)</li>
</ul>

<h2 id="ttl">TTL (Time To Live)</h2>
<p>Le TTL definit combien de temps un enregistrement est cache :</p>
<pre><code># TTL court : 60s (changement rapide)
# TTL standard : 3600s (1 heure)
# TTL long : 86400s (24 heures)</code></pre>

<h2 id="geodns">GeoDNS et Failover</h2>
<p><strong>GeoDNS</strong> : resout vers le serveur le plus proche geographiquement. <strong>Failover</strong> : redirige vers un backup si le primaire echoue.</p>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Que faire si le DNS est lent ?</h4><p>1) Reduire le TTL. 2) Utiliser un resolver local (unbound). 3) Pre-fetch DNS (dns-prefetch HTML tag). 4) CDN avec edge DNS. 5) DNS over HTTPS pour la securite.</p></div>
`},

{id:7,title:"CDN",module:1,difficulty:"facile",duration:"15 min",
content:`
<h2 id="definition">Qu'est-ce qu'un CDN ?</h2>
<p>Un CDN (Content Delivery Network) est un reseau de serveurs distribues geometriquement qui cache le contenu statique proche des utilisateurs.</p>
<div class="callout"><strong>Benefice :</strong> Reduction de la latence (le contenu est plus proche), reduction de la charge sur l'origine, protection contre les pics de trafic.</div>

<h2 id="cloudfront">AWS CloudFront</h2>
<pre><code># Distribution CloudFront
resource "aws_cloudfront_distribution" "cdn" {
  origin {
    domain_name = "mon-bucket.s3.amazonaws.com"
    origin_id   = "S3-mon-bucket"
  }
  
  default_cache_behavior {
    allowed_methods  = ["GET", "HEAD"]
    cached_methods   = ["GET", "HEAD"]
    target_origin_id = "S3-mon-bucket"
    
    forwarded_values {
      query_string = false
      cookies { forward = "none" }
    }
    
    viewer_protocol_policy = "redirect-to-https"
    min_ttl                = 0
    default_ttl            = 3600
    max_ttl                = 86400
  }
}</code></pre>

<h2 id="invalidation">Invalidation</h2>
<p>L'invalidation force le CDN a re-telecharger le contenu depuis l'origine :</p>
<pre><code># Invalidation CloudFront
aws cloudfront create-invalidation \
  --distribution-id E1234567890 \
  --paths "/index.html" "/css/*"</code></pre>
<p><strong>Strategies :</strong> 1) Versioning d'URL (<code>style.v2.css</code>). 2) Invalidation apres deploiement. 3) TTL court pour le developpement.</p>

<h2 id="origin-shielding">Origin Shielding</h2>
<p>Origin shielding ajoute un cache intermediaire pour proteger l'origine :</p>
<ul>
<li>Moins de requetes vers l'origine</li>
<li>Meilleur taux de cache hit</li>
<li>Protection contre les pannes d'origine</li>
</ul>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : CDN pour du contenu dynamique ?</h4><p>Possible avec : 1) Edge computing (CloudFront Functions, Workers). 2) API caching (reponses cacheables). 3) Early hints (103). 4) Cache-Control headers. Le CDN ne cache pas le contenu dynamique mais peut accelerer les headers et les reponses semi-statiques.</p></div>
`},

{id:8,title:"Proxies",module:1,difficulty:"moyen",duration:"15 min",
content:`
<h2 id="definition">Forward vs Reverse Proxy</h2>
<p><strong>Forward Proxy</strong> : se place cote client, cache et securise les requetes sortantes.</p>
<p><strong>Reverse Proxy</strong> : se place cote serveur, distribue et protege les requetes entrantes.</p>
<table style="width:100%;border-collapse:collapse;margin:16px 0">
<tr style="border-bottom:1px solid var(--bdr)"><th style="text-align:left;padding:8px;color:var(--wh)">Critere</th><th style="text-align:left;padding:8px;color:var(--wh)">Forward Proxy</th><th style="text-align:left;padding:8px;color:var(--wh)">Reverse Proxy</th></tr>
<tr style="border-bottom:1px solid var(--bdr)"><td style="padding:8px;color:var(--t2)">Position</td><td style="padding:8px;color:var(--t2)">Cote client</td><td style="padding:8px;color:var(--t2)">Cote serveur</td></tr>
<tr style="border-bottom:1px solid var(--bdr)"><td style="padding:8px;color:var(--t2)">Usage</td><td style="padding:8px;color:var(--t2)">Censurage, VPN</td><td style="padding:8px;color:var(--t2)">Load balancing, SSL</td></tr>
<tr><td style="padding:8px;color:var(--t2)">Exemples</td><td style="padding:8px;color:var(--t2)">Squid, Tor</td><td style="padding:8px;color:var(--t2)">Nginx, HAProxy, Envoy</td></tr>
</table>

<h2 id="transparent">Proxy Transparent</h2>
<p>Un proxy transparent intercepte le trafic sans configuration cote client :</p>
<ul>
<li>Redirection via iptables/prerouting</li>
<li>Cache HTTP transparent</li>
<li>Monitoring sans modification du client</li>
</ul>

<h2 id="lb-vs-proxy">Load Balancer vs Proxy</h2>
<p>Le load balancer est un type de reverse proxy. Differences :</p>
<ul>
<li><strong>Load Balancer</strong> : distribue le trafic, health checks, scaling</li>
<li><strong>Reverse Proxy</strong> : cache, securite, headers, compression, SSL termination</li>
</ul>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Nginx est-il un proxy ou un load balancer ?</h4><p>Les deux. Nginx peut fonctionner comme : 1) Reverse proxy (proxy_pass). 2) Load balancer (upstream). 3) Web server (contenu statique). 4) API gateway (routing). 5) SSL termination. Sa polyvalence est sa force.</p></div>
`},

{id:9,title:"CAP Theorem",module:2,difficulty:"difficile",duration:"20 min",
content:`
<h2 id="definition">Theoreme CAP</h2>
<p>Le theoreme CAP (Brewer, 2000) stipule qu'un systeme distribue ne peut garantir simultanement que 2 des 3 proprietes suivantes :</p>
<div class="formula">C (Coherence) + A (Disponibilite) + P (Tolerance aux Partitions) = 2 sur 3</div>
<ul>
<li><strong>Coherence (C)</strong> : tous les noeuds voient les memes donnees au meme moment</li>
<li><strong>Disponibilite (A)</strong> : chaque requete recoit une reponse (pas d'erreur)</li>
<li><strong>Tolerance aux Partitions (P)</strong> : le systeme continue de fonctionner malgre les coupures reseau</li>
</ul>

<h2 id="pacelc">PACELC</h2>
<p>PACELC etend CAP en考虑ant aussi les cas sans partition :</p>
<div class="formula">En cas de Partition : A ou C. Sinon : Latence ou Coherence.</div>
<ul>
<li><strong>PA/EL</strong> : disponibilite + latence (DynamoDB, Cassandra)</li>
<li><strong>PA/EC</strong> : disponibilite + coherence (MongoDB)</li>
<li><strong>PC/EL</strong> : coherence + latence (non courant)</li>
<li><strong>PC/EC</strong> : coherence + coherence (Spanner, VoltDB)</li>
</ul>

<h2 id="pratique">Implications Pratiques</h2>
<div class="callout"><strong>Realite :</strong> Les partitions reseau arrivent (machines crashent, cables coupe). En pratique, on doit choisir entre A et C quand une partition survient.</div>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Un systeme peut-il etre CP et AP ?</h4><p>Non, c'est contradictoire. Un systeme CP sacrifie la disponibilite en cas de partition (erreur si pas de reponse). Un systeme AP sacrifie la coherence (donnees potentiellement incoherentes). Chaque service peut faire un choix different.</p></div>
<div class="qa"><h4>Q2 : Comment choisir entre CP et AP ?</h4><p><strong>CP</strong> : systemes financiers, inventaire, medicaments (les donnees doivent etre exactes). <strong>AP</strong> : reseaux sociaux, likes, commentaires (disponibilite > coherence exacte). La plupart des apps modernes sont AP avec eventual consistency.</p></div>
`},

{id:10,title:"Consensus",module:2,difficulty:"difficile",duration:"25 min",
content:`
<h2 id="definition">Le Probleme du Consensus</h2>
<p>Le consensus est le processus par lequel plusieurs noeuds d'un systeme distribue s'accordent sur une valeur. C'est fondamental pour la coherence dans les systemes distribues.</p>

<h2 id="paxos">Paxos</h2>
<p>Paxos est l'algorithme de consensus classique (Lamport, 1989) :</p>
<ul>
<li><strong>Prepare</strong> : le proposant envoie un numero de sequence</li>
<li><strong>Promise</strong> : les accepteurs promettent de ne pas accepter de valeur inferieure</li>
<li><strong>Accept</strong> : le proposant envoie une valeur</li>
<li><strong>Accepted</strong> : les accepteurs acceptent si le numero est acceptable</li>
</ul>
<div class="callout warning"><strong>Complexite :</strong> Paxos est tres difficile a implementer correctement. La plupart des systemes utilisent des variantes (Multi-Paxos, Cheap Paxos).</div>

<h2 id="raft">Raft</h2>
<p>Raft est plus simple a comprendre que Paxos, utilise dans etcd, Consul, TiKV :</p>
<ul>
<li><strong>Leader election</strong> : un leader est elu pour coordonner</li>
<li><strong>Log replication</strong> : le leader replicat les operations sur les followers</li>
<li><strong>Safety</strong> : si un log est commite, il sera present sur tous les futurs leaders</li>
</ul>

<h2 id="leader-election">Leader Election</h2>
<pre><code># Cycle de vie Raft
1. Tous les noeuds demarrent en etat Follower
2. Si pas de heartbeat du Leader -> Election
3. Un noeud devient Candidate, demande les votes
4. Si majorite de votes -> nouveau Leader
5. Leader envoie des heartbeats pour maintenir son mandat</code></pre>

<h2 id="transactions">Transactions Distribuees</h2>
<ul>
<li><strong>2PC (Two-Phase Commit)</strong> : prepare + commit/rollback. Bloquant.</li>
<li><strong>3PC</strong> : ajout d'une phase de preparation. Moins bloquant.</li>
<li><strong>Saga</strong> : sequence de transactions locales avec compensation.</li>
</ul>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Paxos vs Raft ?</h4><p><strong>Paxos</strong> : plus flexible, plus difficile a implementer, utilise par Google. <strong>Raft</strong> : plus simple, plus pedagogique, utilise par etcd, Consul. Raft est le choix recommande pour la plupart des systemes.</p></div>
<div class="qa"><h4>Q2 : Comment gerer les split-brains ?</h4><p>Un split-brain survient quand deux leaders coexistent. Solutions : 1) Fencing tokens (numero de sequence). 2) Quorum pour les decisions. 3) STONITH (Shoot The Other Node In The Head). 4) Watchdog timers.</p></div>
`},

{id:11,title:"Consistency Models",module:2,difficulty:"difficile",duration:"20 min",
content:`
<h2 id="strong">Consistance Forte</h2>
<p>Toute lecture retourne la derniere ecriture confirmee. Garantie la coherence absolue.</p>
<div class="formula">Write(x, v1) -> Read(x) = v1 (toujours)</div>
<p>Exemples : bases relationnelles ACID, Spanner, VoltDB.</p>

<h2 id="eventual">Consistance Eventuelle</h2>
<p>Apres une ecriture, les lectures finissent par retourner la nouvelle valeur, mais il peut y avoir un delai.</p>
<div class="formula">Write(x, v1) -> Read(x) = v1 ou v0 (temporairement) -> apres stabilisation = v1</div>
<p>Exemples : Cassandra, DynamoDB, DNS.</p>

<h2 id="causal">Consistance Causale</h2>
<p>Les operations causalement liees sont vues dans l'ordre correct :</pre><code># Exemple causal
Alice ecrit message A
Bob lit message A, puis ecrit reponse B
Meme si B arrive avant A dans le reseau,
un lecteur causal verra A avant B</code></pre>

<h2 id="read-your-writes">Read-Your-Writes</h2>
<p>Un utilisateur voit toujours ses propres ecritures immediatement :</p>
<pre><code># Utilisateur A ecrit
PUT /user/123/name "Jean"
# Utilisateur A lit
GET /user/123/name -> "Jean" (toujours, pas de stale)</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Quand utiliser la consistance forte vs eventuelle ?</h4><p><strong>Forte</strong> : finances, inventaire, medicats (donnees critiques). <strong>Eventuelle</strong> : reseaux sociaux, analytics, cache (tolerance au delai). La plupart des apps modernes utilisent un mix selon les donnees.</p></div>
`},

{id:12,title:"Distributed Storage",module:2,difficulty:"difficile",duration:"25 min",
content:`
<h2 id="gfs">Google File System (GFS)</h2>
<p>GFS est le predecessor de HDFS, concu pour le stockage massif :</p>
<ul>
<li><strong>Chunks</strong> : donnees divisees en blocs de 64MB</li>
<li><strong>Master</strong> : gere les metadonnees (pas les donnees)</li>
<li><strong>Chunkservers</strong> : stockent les blocs physiquement</li>
<li><strong>Replication</strong> : 3 copies par defaut</li>
</ul>

<h2 id="hdfs">HDFS (Hadoop)</h2>
<p>HDFS est l'implementation open source de GFS :</p>
<pre><code># Operations HDFS
hdfs dfs -put localfile.txt /hdfs/path/
hdfs dfs -get /hdfs/path/file.txt localfile.txt
hdfs dfs -ls /hdfs/path/</code></pre>

<h2 id="cassandra">Apache Cassandra</h2>
<p>Cassandra est une base AP distribuee avec un model de donnees oriente colonnes :</p>
<pre><code>-- CQL (Cassandra Query Language)
CREATE TABLE users (
  user_id UUID PRIMARY KEY,
  name TEXT,
  email TEXT
);

INSERT INTO users (user_id, name, email)
VALUES (uuid(), 'Jean', 'jean@example.com');</code></pre>

<h2 id="consistent-hashing">Consistent Hashing</h2>
<p>Le consistent hashing minimise les reorganizations lors de l'ajout/suppression de noeuds :</p>
<pre><code># Anneau de hash
Noeud A -> hash: 0-30%
Noeud B -> hash: 30-60%
Noeud C -> hash: 60-100%

# Ajout d'un noeud D entre B et C
# Seule la portion 60-80% est reorganisee (pas tout)</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Cassandra vs DynamoDB ?</h4><p><strong>Cassandra</strong> : open source, self-hosted, plus flexible, courbe d'apprentissage. <strong>DynamoDB</strong> : managed, serverless, scaling automatique, plus simple. DynamoDB est mieux pour les petits projets, Cassandra pour le controle total.</p></div>
<div class="qa"><h4>Q2 : Comment choisir la partition key ?</h4><p>1) Distribution uniforme (eviter le hot spotting). 2) Acces frequent ensemble. 3) Cardinalite elevee. 4) Test avec les patterns de requetes reels. Ex: user_id pour un access par utilisateur.</p></div>
`},

{id:13,title:"Microservices",module:2,difficulty:"moyen",duration:"25 min",
content:`
<h2 id="decomposition">Decomposition</h2>
<p>Decomposer une application monolithique en microservices :</p>
<ul>
<li><strong>Domain-Driven Design</strong> : un service par bounded context</li>
<li><strong>Data ownership</strong> : chaque service gere sa propre base</li>
<li><strong>Interface contract</strong> : API bien definie entre services</li>
<li><strong>Independent deployability</strong> : deployable sans les autres</li>
</ul>

<h2 id="api-gateway">API Gateway</h2>
<p>L'API Gateway est le point d'entree unique pour les clients :</p>
<ul>
<li><strong>Routing</strong> : diriger vers le bon service</li>
<li><strong>Authentication</strong> : verification des tokens</li>
<li><strong>Rate limiting</strong> : protection contre le abuse</li>
<li><strong>Aggregation</strong> : combiner les reponses de plusieurs services</li>
</ul>

<h2 id="service-discovery">Service Discovery</h2>
<p>Les services se trouvent mutuellement dynamiquement :</p>
<pre><code># Consul - enregistrement
{
  "service": {
    "name": "api-user",
    "port": 8080,
    "check": {
      "http": "http://localhost:8080/health",
      "interval": "10s"
    }
  }
}

# Consul - resolution DNS
nslookup api-user.service.consul</code></pre>

<h2 id="circuit-breaker">Circuit Breaker</h2>
<p>Le circuit breaker evite les cascades d'echecs :</p>
<pre><code># Pattern Circuit Breaker
# Closed -> echecs > seuil -> Open -> timeout -> Half-Open
# Half-Open -> succes -> Closed
# Half-Open -> echec -> Open</code></pre>
<ul>
<li><strong>Closed</strong> : les requetes passent normalement</li>
<li><strong>Open</strong> : les requetes echouent immediatement</li>
<li><strong>Half-Open</strong> : test de quelques requetes</li>
</ul>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Monolithique vs Microservices ?</h4><p><strong>Monolithique</strong> : simple a developper, deployer, debugger. <strong>Microservices</strong> : scalable independamment, technologiquement divers, plus complexe. Commencez monolithique, decoupez quand le besoin se presente (monolithique modulaire).</p></div>
<div class="qa"><h4>Q2 : Comment gerer la transactionnalite entre microservices ?</h4><p>1) Saga pattern (orchestration ou choreography). 2) Event sourcing. 3) Two-phase commit (bloquant, rarement recommande). 4) Idempotence. 5) Compensation transactions. 6) Eventual consistency acceptable.</p></div>
`},

{id:14,title:"Event Sourcing",module:2,difficulty:"difficile",duration:"25 min",
content:`
<h2 id="definition">Event Sourcing</h2>
<p>Event Sourcing stocke tous les changements d'etat comme une sequence d'evenements, pas seulement l'etat actuel :</p>
<div class="formula">State = fold(initialState, allEvents)</div>
<pre><code># Au lieu de:
account.balance = 1000

# On stocke:
events = [
  AccountCreated(timestamp: t0),
  MoneyDeposited(amount: 500, timestamp: t1),
  MoneyWithdrawn(amount: 200, timestamp: t2),
  MoneyDeposited(amount: 700, timestamp: t3)
]
balance = replay(events)  # = 1000</code></pre>

<h2 id="cqrs">CQRS (Command Query Responsibility Segregation)</h2>
<p>CQRS separe les operations de lecture et d'ecriture :</p>
<ul>
<li><strong>Command side</strong> : ecrit les evenements, gere l'etat</li>
<li><strong>Query side</strong> : lit les projections, optimise pour la lecture</li>
</ul>
<pre><code># Command
class CreateOrderCommand:
  items: List[OrderItem]
  customer_id: str

# Event genere
class OrderCreatedEvent:
  order_id: str
  items: List[OrderItem]
  customer_id: str
  timestamp: datetime</code></pre>

<h2 id="event-store">Event Store</h2>
<p>L'event store est la base de donnees des evenements :</p>
<ul>
<li><strong>Append-only</strong> : on n'ecrase jamais</li>
<li><strong>Optimistic concurrency</strong> : detection de conflits par version</li>
<li><strong>Subscriptions</strong> : notification de nouveaux evenements</li>
</ul>

<h2 id="projections">Projections</h2>
<p>Les projections sont des vues materialisees depuis les evenements :</p>
<pre><code># Projection : vues de lecture
# Depuis les evenements OrderCreated, OrderShipped, etc:
- OrderListView: toutes les commandes
- RevenueView: revenus par mois
- CustomerOrdersView: commandes par client</code></pre>

<h2 id="saga">Saga Pattern</h2>
<p>Les sagas orchestrent des transactions distribuees via des evenements :</p>
<pre><code># Saga de commande
1. OrderCreated -> reserveInventory()
2. InventoryReserved -> processPayment()
3. PaymentProcessed -> shipOrder()
4. OrderShipped -> complete

# En cas d'echec:
3. PaymentFailed -> releaseInventory()
2. InventoryRelease -> cancelOrder()</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Event Sourcing vs CRUD traditionnel ?</h4><p><strong>CRUD</strong> : simple, etat actuel uniquement, pas d'historique. <strong>Event Sourcing</strong> : historique complet, audit trail, temps de reversion, mais plus complexe. Utilisez Event Sourcing quand l'historique est critique (finance, medicat).</p></div>
<div class="qa"><h4>Q2 : Comment gerer les schema changes dans Event Sourcing ?</h4><p>1) Upcasting : migrer les anciens evenements au nouveau format. 2) Versioning des evenements. 3) Multi-version support. 4) Mapping cote lecture. 5) Event store immutable avec projections updatable.</p></div>
`},

{id:15,title:"REST API Design",module:3,difficulty:"moyen",duration:"25 min",
content:`
<h2 id="resources">Ressources et URLs</h2>
<p>Bien concevoir les ressources REST :</p>
<pre><code># Bonnes pratiques
GET    /api/v1/users              # Collection
GET    /api/v1/users/123          # Ressource specifique
GET    /api/v1/users/123/orders   # Sous-collection
POST   /api/v1/users              # Creer
PUT    /api/v1/users/123          # Remplacer
PATCH  /api/v1/users/123          # Modifier
DELETE /api/v1/users/123          # Supprimer</code></pre>
<ul>
<li><strong>Noms au pluriel</strong> : /users pas /user</li>
<li><strong>Pas de verbes dans l'URL</strong> : /users/123 pas /getUser?id=123</li>
<li><strong>Niveau de grinite coherant</strong> : pas de /users/123/orders/456/items/789</li>
</ul>

<h2 id="status-codes">Codes de Reponse HTTP</h2>
<ul>
<li><strong>200</strong> : succes</li>
<li><strong>201</strong> : cree</li>
<li><strong>204</strong> : succes sans contenu</li>
<li><strong>400</strong> : requete invalide</li>
<li><strong>401</strong> : non authentifie</li>
<li><strong>403</strong> : non autorise</li>
<li><strong>404</strong> : non trouve</li>
<li><strong>409</strong> : conflit</li>
<li><strong>422</strong> : entite non traitable</li>
<li><strong>429</strong> : trop de requetes</li>
<li><strong>500</strong> : erreur serveur</li>
</ul>

<h2 id="hateoas">HATEOAS</h2>
<p>Hypermedia as the Engine of Application State :</p>
<pre><code>{
  "id": 123,
  "name": "Jean",
  "_links": {
    "self": { "href": "/api/v1/users/123" },
    "orders": { "href": "/api/v1/users/123/orders" },
    "avatar": { "href": "/api/v1/users/123/avatar" }
  }
}</code></pre>

<h2 id="pagination">Pagination</h2>
<pre><code># Pagination par offset
GET /api/v1/users?offset=0&limit=20

# Pagination par curseur (recommandee)
GET /api/v1/users?cursor=abc123&limit=20
{
  "data": [...],
  "pagination": {
    "next_cursor": "def456",
    "has_more": true
  }
}</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : Offset vs Cursor pagination ?</h4><p><strong>Offset</strong> : simple, permet d'aller a une page specifique, lent pour les grandes donnees (skip N rows). <strong>Cursor</strong> : performant, stable, mais ne permet pas d'aller a une page specifique. Cursor est recommande pour les APIs.</p></div>
<div class="qa"><h4>Q2 : Comment gerer les erreurs dans une API ?</h4><p>Format standard : <code>{"error": {"code": "VALIDATION_ERROR", "message": "...", "details": [...]}}</code>. Toujours : 1) Codes HTTP corrects. 2) Messages utiles. 3) Details pour le debugging. 4) Correlation ID pour le tracking.</p></div>
`},

{id:16,title:"GraphQL",module:3,difficulty:"moyen",duration:"25 min",
content:`
<h2 id="schema">Schema et Types</h2>
<pre><code>type Query {
  user(id: ID!): User
  users(limit: Int, offset: Int): [User!]!
}

type Mutation {
  createUser(input: CreateUserInput!): User!
  updateUser(id: ID!, input: UpdateUserInput!): User!
}

type Subscription {
  onUserCreated: User!
}

type User {
  id: ID!
  name: String!
  email: String!
  posts: [Post!]!
}

input CreateUserInput {
  name: String!
  email: String!
}</code></pre>

<h2 id="resolvers">Resolvers</h2>
<pre><code>const resolvers = {
  Query: {
    user: async (_, { id }) => {
      return await db.users.findById(id);
    }
  },
  User: {
    posts: async (parent) => {
      return await db.posts.findByUserId(parent.id);
    }
  }
};</code></pre>

<h2 id="n1">Probleme N+1</h2>
<p>Le probleme N+1 survient quand une requete avec des relations charge les donnees une par une :</p>
<pre><code># N+1 : 1 requete users + N requetes posts
query {
  users {
    name
    posts { title }
  }
}

# Solution : DataLoader
const postLoader = new DataLoader(async (userIds) => {
  const posts = await db.posts.findByUserIds(userIds);
  return userIds.map(id => posts.filter(p => p.userId === id));
});</code></pre>

<h2 id="subscriptions">Subscriptions (WebSocket)</h2>
<pre><code>type Subscription {
  messageSent(chatId: ID!): Message!
}

# Cote serveur
const resolvers = {
  Subscription: {
    messageSent: {
      subscribe: withFilter(
        () => pubsub.asyncIterator('MESSAGE_SENT'),
        (payload, variables) => {
          return payload.messageSent.chatId === variables.chatId;
        }
      )
    }
  }
};</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : GraphQL - over-fetching et N+1 ?</h4><p><strong>Over-fetching</strong> : GraphQL resout en demandant uniquement les champs necessaires. <strong>N+1</strong> : DataLoader resout en batch les requetes. Aussi : schema design, pagination, depth limiting pour eviter les requetes complexes.</p></div>
<div class="qa"><h4>Q2 : GraphQL en production - bonnes pratiques ?</h4><p>1) Rate limiting par query complexity. 2) Depth limiting. 3) Persisted queries. 4) Caching au niveau du resolver. 5) Monitoring des performances. 6) Schema registry. 7) Codegen pour le typage.</p></div>
`},

{id:17,title:"gRPC",module:3,difficulty:"moyen",duration:"20 min",
content:`
<h2 id="protobuf">Protocol Buffers</h2>
<pre><code>// user.proto
syntax = "proto3";

service UserService {
  rpc GetUser (GetUserRequest) returns (User);
  rpc ListUsers (ListUsersRequest) returns (stream User);
  rpc CreateUser (CreateUserRequest) returns (User);
}

message User {
  int32 id = 1;
  string name = 2;
  string email = 3;
  repeated string roles = 4;
}

message GetUserRequest {
  int32 id = 1;
}</code></pre>
<p><strong>Avantages de Protobuf</strong> : serialisation binaire (rapide), schema strict, backward compatible, generation de code automatique.</p>

<h2 id="streaming">Streaming</h2>
<ul>
<li><strong>Server streaming</strong> : le serveur envoie une stream de reponses</li>
<li><strong>Client streaming</strong> : le client envoie une stream de requetes</li>
<li><strong>Bidirectional streaming</strong> : les deux cotes streament</li>
</ul>
<pre><code># Server streaming - notifications temps reel
rpc Subscribe (SubscribeRequest) returns (stream Notification);</code></pre>

<h2 id="interceptors">Interceptors</h2>
<pre><code>// Interceptor gRPC - logging
func LoggingInterceptor(ctx context.Context, req interface{}, info *grpc.UnaryServerInfo, handler grpc.UnaryHandler) (interface{}, error) {
  start := time.Now()
  resp, err := handler(ctx, req)
  log.Printf("Method: %s, Duration: %v", info.FullMethod, time.Since(start))
  return resp, err
}</code></pre>

<h2 id="lb">Load Balancing gRPC</h2>
<p>gRPC utilise HTTP/2 (une seule connexion TCP). Le load balancing se fait cote client :</p>
<ul>
<li><strong>Client-side LB</strong> : le client connait tous les endpoints</li>
<li><strong>Proxy-based LB</strong> : Envoy ou Istio pour le L7 LB</li>
</ul>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : gRPC vs REST - quand utiliser ?</h4><p><strong>gRPC</strong> : service-to-service, haute performance, streaming, types stricts. <strong>REST</strong> : API publique, browser clients, simplicite, cache HTTP. gRPC est ideal pour les microservices internes, REST pour les APIs externes.</p></div>
`},

{id:18,title:"API Security",module:3,difficulty:"difficile",duration:"25 min",
content:`
<h2 id="oauth2">OAuth2</h2>
<p>OAuth2 est le standard pour l'autorisation :</p>
<pre><code># Authorization Code Flow
1. Client redirige vers /authorize
2. Utilisateur s'authentifie
3. Serveur redirige avec code d'autorisation
4. Client echange le code contre un access token
5. Client utilise le token pour acceder aux APIs

# Endpoints
GET  /authorize?response_type=code&client_id=xxx&redirect_uri=xxx
POST /token
  grant_type=authorization_code&code=xxx&client_id=xxx&client_secret=xxx</code></pre>

<h2 id="jwt">JWT (JSON Web Tokens)</h2>
<pre><code># Structure JWT
Header.Payload.Signature

# Header
{"alg": "RS256", "typ": "JWT"}

# Payload
{
  "sub": "1234567890",
  "name": "Jean Dupont",
  "roles": ["admin", "user"],
  "iat": 1516239022,
  "exp": 1516242622
}

# Verification
const decoded = jwt.verify(token, publicKey, { algorithms: ['RS256'] });</code></pre>

<h2 id="rate-limiting-api">Rate Limiting</h2>
<pre><code># Token Bucket
class TokenBucket {
  constructor(capacity, refillRate) {
    this.tokens = capacity;
    this.capacity = capacity;
    this.refillRate = refillRate;
  }
  
  consume() {
    if (this.tokens > 0) {
      this.tokens--;
      return true;
    }
    return false;
  }
}</code></pre>

<h2 id="cors">CORS</h2>
<pre><code># Headers CORS
Access-Control-Allow-Origin: https://mon-app.com
Access-Control-Allow-Methods: GET, POST, PUT, DELETE
Access-Control-Allow-Headers: Content-Type, Authorization
Access-Control-Max-Age: 86400</code></pre>

<h2 id="input-validation">Validation des Inputs</h2>
<pre><code># Validation avec Zod
const userSchema = z.object({
  name: z.string().min(2).max(100),
  email: z.string().email(),
  age: z.number().int().min(0).max(150)
});

const result = userSchema.safeParse(req.body);
if (!result.success) {
  return res.status(400).json({ errors: result.error.issues });
}</code></pre>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : JWT vs Sessions ?</h4><p><strong>JWT</strong> : stateless, scalable, pas de cote serveur, mais pas de revocation facile. <strong>Sessions</strong> : stateful, revocation simple, mais necessite un store cote serveur. JWT pour les APIs, sessions pour les apps web traditionnelles.</p></div>
<div class="qa"><h4>Q2 : Comment prevenir les attaques sur une API ?</h4><p>1) Rate limiting. 2) Input validation. 3) CORS strict. 4) Authentication (JWT/OAuth). 5) Authorization (RBAC). 6) HTTPS partout. 7) Headers de securite (HSTS, CSP). 8) Logging et monitoring.</p></div>
`},

{id:20,title:"WebSockets",module:3,difficulty:"moyen",duration:"20 min",
content:`
<h2 id="protocol">Protocole WebSocket</h2>
<p>WebSockets offrent une connexion bidirectionnelle persistante entre le client et le serveur :</p>
<pre><code># Handshake WebSocket
GET /chat HTTP/1.1
Host: server.example.com
Upgrade: websocket
Connection: Upgrade
Sec-WebSocket-Key: x3JJHMbDL1EzLkh9GBhXDw==
Sec-WebSocket-Version: 13

# Reponse
HTTP/1.1 101 Switching Protocols
Upgrade: websocket
Connection: Upgrade
Sec-WebSocket-Accept: HSmrc0sMlYUkAGmm5OPpG2HaGWk=</code></pre>

<h2 id="scaling">Scaling des WebSockets</h2>
<ul>
<li><strong>Sticky sessions</strong> : garder le client sur le meme serveur</li>
<li><strong>Pub/Sub</strong> : Redis Pub/Sub pour la communication inter-serveurs</li>
<li><strong>Horizontal scaling</strong> : ajouter des serveurs WebSocket</li>
</ul>
<pre><code># Architecture de scaling
Client A -> Server 1 -> Redis Pub/Sub -> Server 2 -> Client B
                  |                      |
                  +----------------------+</code></pre>

<h2 id="socketio">Socket.IO</h2>
<pre><code>// Serveur
const io = new Server(server, {
  cors: { origin: "https://mon-app.com" }
});

io.on('connection', (socket) => {
  socket.on('join-room', (roomId) => {
    socket.join(roomId);
  });
  
  socket.on('message', (data) => {
    io.to(data.roomId).emit('message', data);
  });
});

// Client
const socket = io('https://mon-app.com');
socket.emit('join-room', 'room-123');
socket.on('message', (data) => console.log(data));</code></pre>

<h2 id="real-time">Use Cases Temps Reel</h2>
<ul>
<li><strong>Chat</strong> : messagerie en direct</li>
<li><strong>Notifications</strong> : alertes push</li>
<li><strong>Collaboration</strong> : edition simultanee (Google Docs)</li>
<li><strong>Dashboard</strong> : metriques en temps reel</li>
<li><strong>Gaming</strong> : etat du jeu synchronise</li>
</ul>

<h2 id="interview">Questions d'entretien frequentes</h2>
<div class="qa"><h4>Q1 : WebSockets vs Server-Sent Events (SSE) ?</h4><p><strong>WebSockets</strong> : bidirectionnel, plus flexible, plus complexe. <strong>SSE</strong> : unidirectionnel (serveur -> client), plus simple, reconnection automatique. SSE pour les notifications, WebSockets pour le chat/collaboration.</p></div>
<div class="qa"><h4>Q2 : Comment gerer les reconnexions WebSocket ?</h4><p>1) Backoff exponentiel (1s, 2s, 4s, 8s...). 2) Heartbeat pour detecter les connexions mortes. 3) Queue cote client pour les messages pendant la deconnexion. 4) Acknowledgments cote serveur. 5) Socket.IO gere automatiquement la reconnexion.</p></div>
`}
];

function getProgress(){return JSON.parse(localStorage.getItem('sd_progress')||'{}')}
function setProgress(id,val){const p=getProgress();p[id]=val;localStorage.setItem('sd_progress',JSON.stringify(p))}

function getLesson(id){return LESSONS.find(l=>l.id===id)}
function getModuleForLesson(id){return MODULES.find(m=>m.lessons.includes(id))}
function getLessonIndex(id){return LESSONS.findIndex(l=>l.id===id)}

function renderSidebar(currentId){
  const progress=getProgress();
  const completed=Object.values(progress).filter(v=>v).length;
  const total=LESSONS.length;
  let html=`
  <div class="sidebar-box">
    <h4>Progression</h4>
    <div class="progress-bar"><div class="progress-fill" style="width:${(completed/total)*100}%"></div></div>
    <p class="progress-text">${completed}/${total} lecons completees</p>
  </div>`;
  
  MODULES.forEach(mod=>{
    const isOpen=getModuleForLesson(currentId)?.id===mod.id;
    html+=`<div class="sidebar-box">
      <h4 class="module-toggle ${isOpen?'':'collapsed'}" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed')">Module ${mod.id}: ${mod.name}</h4>
      <div class="module-lessons ${isOpen?'':'collapsed'}" style="max-height:${mod.lessons.length*40}px">`;
    mod.lessons.forEach(lid=>{
      const lesson=getLesson(lid);
      const isCurrent=lid===currentId;
      const isCompleted=progress[lid];
      html+=`<a class="lesson-link ${isCurrent?'active':''} ${isCompleted?'completed':''}" href="?id=${lid}">
        <span class="check">&#10003;</span> ${lid}. ${lesson.title}
      </a>`;
    });
    html+=`</div></div>`;
  });
  return html;
}

function renderNav(currentId){
  const idx=getLessonIndex(currentId);
  let html='';
  if(idx>0){
    const prev=LESSONS[idx-1];
    html+=`<a href="?id=${prev.id}"><span>&#8592; Lecon precedente</span>${prev.title}</a>`;
  }else{html+=`<div></div>`}
  if(idx<LESSONS.length-1){
    const next=LESSONS[idx+1];
    html+=`<a href="?id=${next.id}" style="text-align:right"><span>Lecon suivante &#8594;</span>${next.title}</a>`;
  }
  return html;
}

function init(){
  const params=new URLSearchParams(window.location.search);
  const id=parseInt(params.get('id'))||1;
  const lesson=getLesson(id);
  if(!lesson){document.getElementById('lesson-content').innerHTML='<p>Lecon non trouvee.</p>';return}
  const mod=getModuleForLesson(id);
  
  document.getElementById('breadcrumb').innerHTML=`<a href="/">Accueil</a> / <a href="/pages/system-design.html">System Design</a> / Module ${mod.id} / ${lesson.title}`;
  document.getElementById('lesson-title').textContent=lesson.title;
  document.getElementById('lesson-meta').innerHTML=`
    <span class="meta-item">Module ${mod.id} : ${mod.name}</span>
    <span class="meta-item">Lecon ${id}/${LESSONS.length}</span>
    <span class="meta-item">${lesson.duration}</span>
    <span class="badge badge-${lesson.difficulty}">${lesson.difficulty.charAt(0).toUpperCase()+lesson.difficulty.slice(1)}</span>`;
  document.getElementById('lesson-content').innerHTML=lesson.content;
  document.getElementById('nav-lesson').innerHTML=renderNav(id);
  document.getElementById('sidebar').innerHTML=renderSidebar(id);
  
  setProgress(id,true);
  renderSidebar(id);
  
  const toc=document.querySelectorAll('.toc a');
  const sections=document.querySelectorAll('h2[id]');
  window.addEventListener('scroll',()=>{
    let current='';
    sections.forEach(s=>{if(window.scrollY>=s.offsetTop-100)current=s.id});
    toc.forEach(a=>{a.classList.toggle('active',a.getAttribute('href')==='#'+current)});
  });
}
init();
</script>
</body>
