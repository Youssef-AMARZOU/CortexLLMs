content:`<div class="section-title">Notation Grand O</div>
<table>
<tr><th>Notation</th><th>Nom</th><th>Exemple</th><th>Description</th></tr>
<tr><td><code>O(1)</code></td><td>Constant</td><td>Acces tableau par index</td><td>Temps fixe quelle que soit la taille</td></tr>
<tr><td><code>O(log n)</code></td><td>Logarithmique</td><td>Binary search</td><td>Divise l'espace de recherche par 2</td></tr>
<tr><td><code>O(n)</code></td><td>Lineaire</td><td>Boucle simple</td><td>Parcourt tous les elements</td></tr>
<tr><td><code>O(n log n)</code></td><td>Lineaire-log</td><td>Merge sort, Quick sort (moy)</td><td>Diviser pour regner optimal</td></tr>
<tr><td><code>O(n²)</code></td><td>Quadratique</td><td>Boucles imbriquees</td><td>Paire d'elements comparee</td></tr>
<tr><td><code>O(2ⁿ)</code></td><td>Exponentiel</td><td>Sous-ensembles, brute force</td><td>Double a chaque ajout</td></tr>
</table>
<div class="section-title">Complexites courantes</div>
<pre><code># Recherche lineaire : O(n)
for x in arr:
    if x == target: return i

# Binary search : O(log n)
while lo <= hi:
    mid = (lo+hi)//2
    if arr[mid]==target: return mid
    elif arr[mid]<target: lo=mid+1
    else: hi=mid-1

# Tri fusion : O(n log n)
def merge_sort(arr):
    if len(arr)<=1: return arr
    mid=len(arr)//2
    return merge(merge_sort(arr[:mid]),merge_sort(arr[mid:]))</code></pre>`

id:3,title:"SQL Essentiel",icon:"&#x1F5C3;",tag:"Donnees",cat:"data",
content:`<div class="section-title">Types de JOIN</div>
<pre><code>-- INNER JOIN : lignes correspondantes uniquement
SELECT * FROM A INNER JOIN B ON A.id=B.fk;

-- LEFT JOIN : toutes les lignes de A
SELECT * FROM A LEFT JOIN B ON A.id=B.fk;

-- RIGHT JOIN : toutes les lignes de B
SELECT * FROM A RIGHT JOIN B ON A.id=B.fk;

-- FULL OUTER JOIN : toutes les lignes
SELECT * FROM A FULL OUTER JOIN B ON A.id=B.fk;</code></pre>
<div class="section-title">Window Functions</div>
<pre><code>-- Rank avec ROW_NUMBER, RANK, DENSE_RANK
SELECT name, score,
  ROW_NUMBER() OVER (ORDER BY score DESC) AS rn,
  RANK() OVER (ORDER BY score DESC) AS rnk,
  SUM(score) OVER (PARTITION BY dept ORDER BY date) AS running_total,
  AVG(score) OVER (PARTITION BY dept) AS dept_avg
FROM employees;</code></pre>
<div class="section-title">Optimisation</div>
<pre><code>-- Analyser une requete
EXPLAIN ANALYZE SELECT * FROM users WHERE email='x';

-- Creer un index
CREATE INDEX idx_users_email ON users(email);

-- Index composite
CREATE INDEX idx_orders_date_status ON orders(created_at, status);</code></pre>
<div class="section-title">GROUP BY et HAVING</div>
<pre><code>SELECT department, COUNT(*) AS nb, AVG(salary) AS sal
FROM employees
GROUP BY department
HAVING AVG(salary) > 50000
ORDER BY sal DESC;</code></pre>`

<pre><code># Pod : unite minimale
apiVersion: v1
kind: Pod

<div class="section-title">Service et Ingress</div>
<pre><code># Service : accès aux pods
apiVersion: v1
kind: Service
metadata:
  name: mon-service
spec:
  selector:
    app: mon-app
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP

# Ingress : routage HTTP

metadata:
  name: mon-ingress
spec:
  rules:
  - host: mon-app.com

      paths:
      - path: /

content:`<div class="section-title">Load Balancing</div>
<table>
<tr><th>Algorithme</th><th>Description</th><th>Usage</th></tr>
<tr><td>Round Robin</td><td>Tour par tour</td><td>Serveurs egaux</td></tr>
<tr><td>Least Connections</td><td>Moins de connexions actives</td><td>Charge variable</td></tr>
<tr><td>IP Hash</td><td>Hash de l'IP client</td><td>Affinite de session</td></tr>
<tr><td>Weighted</td><td>Basé sur la capacite</td><td>Serveurs heterogenes</td></tr>
</table>
<div class="section-title">Caching</div>
<table>
<tr><th>Niveau</th><th>Exemple</th><th>Latence</th></tr>
<tr><td>CDN</td><td>CloudFront, Cloudflare</td><td>&lt;50ms</td></tr>
<tr><td>Application</td><td>Redis, Memcached</td><td>&lt;1ms</td></tr>
<tr><td>Database</td><td>Query cache, Buffer pool</td><td>~1ms</td></tr>
</table>
<div class="section-title">Theoreme CAP</div>
<pre><code>CAP : impossible d'avoir les 3 en meme temps
- CP : Consistent + Partition tolerant (MongoDB, HBase)
- AP : Disponible + Partition tolerant (Cassandra, DynamoDB)

const grid=document.getElementById('grid');
cheatsheets.forEach(c=>{
const card=document.createElement('div');
card.className='cheat-card';
card.dataset.cat=c.cat;
card.innerHTML=`
<div class="cheat-header" onclick="toggleCard(this)">
<div class="cheat-icon">${c.icon}</div>
<h3>${c.title}</h3>
<span class="tag">${c.tag}</span>
<span class="expand-icon">&#9662;</span>
</div>
<div class="cheat-body">
<button class="copy-btn" onclick="copyContent(this,event)">Copier</button>
${c.content}
</div>`;
grid.appendChild(card);
});

function toggleCard(header){
const card=header.parentElement;
card.classList.toggle('open');
}

function copyContent(btn,e){
e.stopPropagation();
const body=btn.parentElement;
const text=body.innerText.replace('Copier','').trim();
navigator.clipboard.writeText(text).then(()=>{
btn.textContent='Copie!';
btn.classList.add('copied');
setTimeout(()=>{btn.textContent='Copier';btn.classList.remove('copied')},2000);
});
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
btn.addEventListener('click',()=>{
document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
const cat=btn.dataset.cat;
document.querySelectorAll('.cheat-card').forEach(c=>{
c.style.display=(cat==='all'||c.dataset.cat===cat)?'':'none';
});
});
});
</script>
