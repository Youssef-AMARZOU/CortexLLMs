<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription - CortexLLMs.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Source+Serif+4:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0d0f;--card:#1a1a2e;--nav:rgba(13,13,15,.85);--acc:#3b82f6;--acc-h:#2563eb;--acc-l:rgba(59,130,246,.15);--t1:#f1f5f9;--t2:#94a3b8;--t3:#64748b;--bdr:#1e293b;--bdr2:#2d3748;--wh:#fff;--gbl:linear-gradient(135deg,#3b82f6,#8b5cf6);--r:12px;--rl:16px;--nh:72px}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--t1);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit;transition:color .2s}
.auth-wrapper{flex:1;display:flex;align-items:center;justify-content:center;padding:calc(var(--nh) + 24px) 24px 48px}
.auth-card{width:100%;max-width:440px;background:linear-gradient(145deg,#1a1a2e,#16162a);border:1px solid var(--bdr);border-radius:var(--rl);padding:48px 40px;position:relative;overflow:hidden}
.auth-card::before{content:'';position:absolute;top:-100px;left:50%;transform:translateX(-50%);width:400px;height:200px;background:radial-gradient(ellipse,rgba(59,130,246,.08),transparent);pointer-events:none}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:2px;font-family:'Source Serif 4',Georgia,serif;font-size:1.5rem;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
.auth-logo .lm{color:var(--wh)}.auth-logo .la{color:var(--acc)}
.auth-subtitle{text-align:center;color:var(--t2);font-size:.95rem;margin-bottom:36px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:.85rem;font-weight:600;color:var(--t2);margin-bottom:8px}
.form-group input{width:100%;padding:14px 16px;background:rgba(255,255,255,.04);border:1px solid var(--bdr2);border-radius:var(--r);color:var(--t1);font-size:.95rem;font-family:'Inter',sans-serif;transition:border-color .2s,box-shadow .2s;outline:none}
.form-group input::placeholder{color:var(--t3)}
.form-group input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.form-group input.error{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.15)}
.form-error{font-size:.8rem;color:#ef4444;margin-top:6px;display:none}
.form-error.visible{display:block}
.btn-auth{width:100%;padding:14px;background:var(--acc);color:var(--wh);border:none;border-radius:var(--r);font-size:1rem;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:background .2s,transform .2s,box-shadow .2s;margin-top:8px}
.btn-auth:hover{background:var(--acc-h);transform:translateY(-1px);box-shadow:0 4px 16px rgba(59,130,246,.3)}
.btn-auth:active{transform:translateY(0)}
.btn-auth:disabled{opacity:.6;cursor:not-allowed;transform:none}
.auth-footer{text-align:center;margin-top:24px;font-size:.9rem;color:var(--t2)}
.auth-footer a{color:var(--acc);font-weight:600;transition:color .2s}
.auth-footer a:hover{color:var(--acc-h)}
.toast{position:fixed;top:calc(var(--nh) + 16px);right:16px;padding:14px 20px;background:#ef4444;color:var(--wh);border-radius:var(--r);font-size:.9rem;font-weight:500;z-index:9999;opacity:0;transform:translateY(-10px);transition:opacity .3s,transform .3s;pointer-events:none;max-width:380px}
.toast.show{opacity:1;transform:translateY(0);pointer-events:auto}
@media(max-width:480px){.auth-card{padding:32px 24px}}
</style>
</head>
<body>

<header class="header" style="position:fixed;top:0;left:0;right:0;height:var(--nh);background:var(--nav);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);z-index:1000">
<nav style="display:flex;align-items:center;justify-content:space-between;height:100%;max-width:1200px;margin:0 auto;padding:0 24px">
<a href="/" class="auth-logo" style="margin:0;font-size:1.35rem"><span class="lm">CortexLLMs</span><span class="la">.io</span></a>
<a href="/pages/login.html" style="padding:8px 18px;background:rgba(255,255,255,.06);color:var(--t1);border:1px solid var(--bdr2);border-radius:8px;font-weight:600;font-size:.875rem;transition:all .2s">Se connecter</a>
</nav>
</header>

<main class="auth-wrapper">
<div class="auth-card">
<div class="auth-logo"><span class="lm">CortexLLMs</span><span class="la">.io</span></div>
<p class="auth-subtitle">Creez votre compte pour commencer</p>

<form id="registerForm" novalidate>
<div class="form-group">
<label for="username">Nom d'utilisateur</label>
<input type="text" id="username" name="username" placeholder="Votre nom d'utilisateur" required autocomplete="username">
</div>
<div class="form-group">
<label for="email">Adresse email</label>
<input type="email" id="email" name="email" placeholder="vous@exemple.com" required autocomplete="email">
</div>
<div class="form-group">
<label for="password">Mot de passe</label>
<input type="password" id="password" name="password" placeholder="Minimum 8 caracteres" required autocomplete="new-password">
<div class="form-error" id="passwordError">Le mot de passe doit contenir au moins 8 caracteres.</div>
</div>
<div class="form-group">
<label for="confirmPassword">Confirmer le mot de passe</label>
<input type="password" id="confirmPassword" name="confirmPassword" placeholder="Retapez votre mot de passe" required autocomplete="new-password">
<div class="form-error" id="confirmError">Les mots de passe ne correspondent pas.</div>
</div>
<button type="submit" class="btn-auth" id="submitBtn">S'inscrire</button>
</form>

<p class="auth-footer">Deja un compte ? <a href="login.html">Se connecter</a></p>
</div>
</main>

<div class="toast" id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
(function() {
  var form = document.getElementById('registerForm');
  var submitBtn = document.getElementById('submitBtn');
  var toast = document.getElementById('toast');
  var passwordInput = document.getElementById('password');
  var confirmPasswordInput = document.getElementById('confirmPassword');
  var passwordError = document.getElementById('passwordError');
  var confirmError = document.getElementById('confirmError');

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 4000);
  }

  function clearErrors() {
    passwordInput.classList.remove('error');
    confirmPasswordInput.classList.remove('error');
    passwordError.classList.remove('visible');
    confirmError.classList.remove('visible');
  }

  passwordInput.addEventListener('input', function() {
    clearErrors();
    if (passwordInput.value.length > 0 && passwordInput.value.length < 8) {
      passwordInput.classList.add('error');
      passwordError.classList.add('visible');
    }
  });

  confirmPasswordInput.addEventListener('input', function() {
    clearErrors();
    if (confirmPasswordInput.value && confirmPasswordInput.value !== passwordInput.value) {
      confirmPasswordInput.classList.add('error');
      confirmError.classList.add('visible');
    }
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    clearErrors();

    var username = document.getElementById('username').value.trim();
    var email = document.getElementById('email').value.trim();
    var password = passwordInput.value;
    var confirmPassword = confirmPasswordInput.value;

    if (!username || !email || !password || !confirmPassword) {
      showToast('Veuillez remplir tous les champs.');
      return;
    }

    if (password.length < 8) {
      passwordInput.classList.add('error');
      passwordError.classList.add('visible');
      showToast('Le mot de passe doit contenir au moins 8 caracteres.');
      return;
    }

    if (password !== confirmPassword) {
      confirmPasswordInput.classList.add('error');
      confirmError.classList.add('visible');
      showToast('Les mots de passe ne correspondent pas.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Inscription en cours...';

    App.api.post('/api/auth/register', {
      username: username,
      email: email,
      password: password
    })
      .then(function(data) {
        if (data.token) {
          localStorage.setItem('token', data.token);
        }
        if (data.user) {
          localStorage.setItem('user', JSON.stringify(data.user));
        }
        window.location.href = '/pages/dashboard.html';
      })
      .catch(function(err) {
        showToast(err.message || 'Une erreur est survenue. Veuillez reessayer.');
        submitBtn.disabled = false;
        submitBtn.textContent = "S'inscrire";
      });
  });
})();
</script>
</body>
</html>
