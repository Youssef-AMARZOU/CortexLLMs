services:
  - type: web
    name: cortexllms
    runtime: node
    plan: free
    buildCommand: npm install && mkdir -p data && node seed.js
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
